<script>
/* ---------------- storage portability shim ----------------
   window.storage is Claude's built-in artifact persistence API and only
   exists when this file runs inside a Claude.ai conversation. When this
   file is deployed standalone (Netlify, GitHub Pages, opened locally, etc.)
   we transparently back it with localStorage instead, so the exact same
   file works in both places. Per-browser only when running standalone —
   data will not sync across different computers/users in that mode. */
if(!window.storage){
  const LS_PREFIX = 'signflow:';
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem(LS_PREFIX+key);
      if(raw===null) throw new Error('key not found: '+key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(LS_PREFIX+key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(LS_PREFIX+key);
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = Object.keys(localStorage)
        .filter(k=>k.startsWith(LS_PREFIX+(prefix||'')))
        .map(k=>k.slice(LS_PREFIX.length));
      return { keys, prefix, shared: !!shared };
    }
  };
}

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
const { PDFDocument, rgb } = PDFLib;

const STATUS_LABEL = { Draft:'טיוטה', Sent:'נשלח', InProgress:'בתהליך', Completed:'הושלם', Declined:'נדחה', Voided:'בוטל' };
const STATUS_CLASS = { Draft:'badge-draft', Sent:'badge-sent', InProgress:'badge-progress', Completed:'badge-completed', Declined:'badge-declined', Voided:'badge-voided' };
const ROLE_LABEL = { admin:'מנהל מערכת', sender:'שולח מסמכים', signer:'חותם' };
const ROLE_CLASS = { admin:'role-admin', sender:'role-sender', signer:'role-signer' };

const nowISO = () => new Date().toISOString();
const fmtDT = (iso) => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); };
const fmtD = (iso) => { if(!iso) return '—'; return new Date(iso).toLocaleDateString('he-IL'); };
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const wrap=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; wrap.appendChild(el); setTimeout(()=>el.remove(),3200); }
function toastError(msg){ const wrap=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className='toast toast-error'; el.textContent='⚠ '+msg; wrap.appendChild(el); setTimeout(()=>el.remove(),5000); }

async function sha256(bytesOrString){
  let buf = typeof bytesOrString === 'string' ? new TextEncoder().encode(bytesOrString) : bytesOrString;
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function bufToBase64(buf){ let binary=''; const bytes=new Uint8Array(buf); for(let i=0;i<bytes.byteLength;i++) binary+=String.fromCharCode(bytes[i]); return btoa(binary); }
function base64ToBuf(b64){ const binary=atob(b64); const bytes=new Uint8Array(binary.length); for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i); return bytes.buffer; }

/* ---------------- storage: local backend (this browser only) ---------------- */
const LocalStorageAPI = {
  async listEnvelopeIds(){ try{ const r=await window.storage.get('envelope-index'); return r?JSON.parse(r.value):[]; }catch(e){ return []; } },
  async saveIndex(ids){ await window.storage.set('envelope-index', JSON.stringify(ids)); },
  async getEnvelope(id){ try{ const r=await window.storage.get('envelope:'+id); return r?JSON.parse(r.value):null; }catch(e){ return null; } },
  async saveEnvelope(env){ await window.storage.set('envelope:'+env.id, JSON.stringify(env)); const ids=await this.listEnvelopeIds(); if(!ids.includes(env.id)){ ids.unshift(env.id); await this.saveIndex(ids); } },
  async getRoster(){ try{ const r=await window.storage.get('roster'); return r?JSON.parse(r.value):[]; }catch(e){ return []; } },
  async upsertPerson(person){
    const list = await this.getRoster();
    const idx = list.findIndex(p=>p.id===person.id);
    if(idx>=0) list[idx]=person; else list.push(person);
    await window.storage.set('roster', JSON.stringify(list));
  },
  async deletePerson(id){
    const list = (await this.getRoster()).filter(p=>p.id!==id);
    await window.storage.set('roster', JSON.stringify(list));
  },
  async getCurrentUserId(){ try{ const r=await window.storage.get('current-user-id'); return r && r.value ? r.value : null; }catch(e){ return null; } },
  async setCurrentUserId(id){ await window.storage.set('current-user-id', id||''); }
};

async function tryInitFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY"){

    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    fbApp = initializeApp(firebaseConfig);
    fbDb = firestoreMod.getFirestore(fbApp);
    fbAuth = authMod.getAuth(fbApp);
    await authMod.signInAnonymously(fbAuth); // anonymous identity so Firestore rules can require auth != null
    window.__fb = { firestoreMod, authMod }; // keep module refs reachable for CloudStorageAPI below
    console.info('[signflow] Connected to Firebase project (Firestore only, free Spark plan):', firebaseConfig.projectId);
    return true;
  }catch(err){
    console.error('[signflow] Firebase init failed, falling back to local storage:', err);
    toastError('החיבור ל-Firebase נכשל — עובד במצב מקומי בלבד. פרטים בקונסולת הדפדפן.');
    return false;
  }
}

/* PDFs are stored directly inside the Firestore document (base64) so the whole
   backend runs on the free Spark plan — no Firebase Storage / Blaze plan needed.
   Firestore caps each document at 1MB, so we keep a safety margin here and
   warn the user client-side before they even try to upload a file that's too big. */
const FIRESTORE_SAFE_PDF_BYTES = 650 * 1024; // ~650KB raw PDF ≈ ~890KB after base64 + JSON overhead

const CloudStorageAPI = {
  async listEnvelopeIds(){
    const { collection, getDocs } = window.__fb.firestoreMod;
    const snap = await getDocs(collection(fbDb,'envelopes'));
    return snap.docs.map(d=>d.id);
  },
  async getEnvelope(id){
    const { doc, getDoc } = window.__fb.firestoreMod;
    const snap = await getDoc(doc(fbDb,'envelopes',id));
    if(!snap.exists()) return null;
    return { id, ...snap.data() };
  },
  async saveEnvelope(env){
    const { doc, setDoc } = window.__fb.firestoreMod;
    const toSave = { ...env };
    delete toSave.id;
    await setDoc(doc(fbDb,'envelopes',env.id), toSave);
  },
  async getRoster(){
    const { collection, getDocs } = window.__fb.firestoreMod;
    const snap = await getDocs(collection(fbDb,'roster'));
    return snap.docs.map(d=>({ id:d.id, ...d.data() }));
  },
  async upsertPerson(person){
    const { doc, setDoc } = window.__fb.firestoreMod;
    const data = {
      name: person.name||'', email: person.email||'', phone: person.phone||'',
      role: person.role||'signer', internal: person.internal!==false,
      signatureImage: person.signatureImage||'',
      // שדות התראות Push — נשמרים כאן במפורש כדי שלא יימחקו בכל עריכת פרופיל דרך savePerson
      fcmToken: person.fcmToken||null, notificationsEnabledAt: person.notificationsEnabledAt||null,
    };
    await setDoc(doc(fbDb,'roster',person.id), data);
  },
  async deletePerson(id){
    const { doc, deleteDoc } = window.__fb.firestoreMod;
    await deleteDoc(doc(fbDb,'roster',id));
  },
  // "who am I pretending to be" is a per-device UI convenience, not shared org data — keep it local
  async getCurrentUserId(){ return localStorage.getItem('signflow:current-user-id') || null; },
  async setCurrentUserId(id){ localStorage.setItem('signflow:current-user-id', id||''); }
};

let StorageAPI = LocalStorageAPI; // swapped to CloudStorageAPI at startup if Firebase is configured
let usingCloudBackend = false;

/* ---------------- PUSH NOTIFICATIONS (Firebase Cloud Messaging) ----------------
   Two things must be filled in below before this actually works:
   1. FCM_VAPID_KEY  — Firebase Console → Project settings → Cloud Messaging →
      Web configuration → "Generate key pair".
   2. PUSH_WORKER_URL — the address of a small Cloudflare Worker (deployed
      separately) that holds the Firebase Service Account and performs the
      actual send via the FCM HTTP v1 API. Browsers cannot send FCM messages
      directly/securely, so this indirection is required.
   Until both are filled in, notification permission/token requests are skipped
   (or clearly reported to the user) and the rest of the app keeps working
   exactly as before — this is purely additive. */
const FCM_VAPID_KEY = ''; // TODO: להדביק כאן את מפתח ה-VAPID
const PUSH_WORKER_URL = ''; // TODO: להדביק כאן את כתובת ה-Cloudflare Worker
const PUSH_WORKER_SECRET = ''; // TODO: להדביק כאן את אותו SEND_SECRET שהוגדר ב-Worker (מונע שליחת פוש על ידי גורם חיצוני שמצא את הכתובת)

let fbMessaging = null; // cached { mod, instance } once initialized
async function tryGetMessaging(){
  if(!usingCloudBackend) return null; // tokens are stored on roster docs in Firestore — needs the cloud backend
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return null;
  if(fbMessaging) return fbMessaging;
  try{
    const messagingMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    fbMessaging = { mod: messagingMod, instance: messagingMod.getMessaging(fbApp) };
    return fbMessaging;
  }catch(err){
    console.error('[signflow] Firebase Messaging init failed', err);
    return null;
  }
}

async function enablePushNotifications(){
  const cu = getCurrentUser();
  if(!cu){ toast('יש לבחור זהות דרך "מחובר/ת כ:" לפני הפעלת התראות'); return; }
  if(!FCM_VAPID_KEY){ toastError('התראות טרם הוגדרו סופית באתר (חסר מפתח VAPID) — זו הודעה למפתח האתר, לא תקלה אצלכם.'); return; }
  const fbm = await tryGetMessaging();
  if(!fbm){ toastError('הדפדפן הזה לא תומך בהתראות Push, או שהאתר עדיין לא רץ ב-HTTPS. באייפון/Safari יש להתקין קודם את האתר למסך הבית.'); return; }
  try{
    const permission = await Notification.requestPermission();
    if(permission!=='granted'){ toast('לא אושרה הרשאת התראות. אפשר לאשר בהמשך דרך הגדרות הדפדפן.'); return; }
    const reg = await navigator.serviceWorker.register('./sw.js');
    const token = await fbm.mod.getToken(fbm.instance, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) throw new Error('לא התקבל טוקן התראות מהדפדפן');
    cu.fcmToken = token; cu.notificationsEnabledAt = nowISO();
    await StorageAPI.upsertPerson(cu);
    await refreshRoster();
    toast('התראות הופעלו בהצלחה 🔔');
    render();
  }catch(err){
    console.error('[signflow] enablePushNotifications failed', err);
    toastError('שגיאה בהפעלת התראות: ' + err.message);
  }
}
async function disablePushNotifications(){
  const cu = getCurrentUser();
  if(!cu) return;
  try{
    const fbm = await tryGetMessaging();
    if(fbm){ try{ await fbm.mod.deleteToken(fbm.instance); }catch(e){ /* לא קריטי אם נכשל */ } }
    cu.fcmToken = '';
    await StorageAPI.upsertPerson(cu);
    await refreshRoster();
    toast('התראות בוטלו');
    render();
  }catch(err){
    console.error('[signflow] disablePushNotifications failed', err);
    toastError('שגיאה בביטול התראות: ' + err.message);
  }
}

async function sendPushViaWorker(token, title, body){
  if(!token) return;
  if(!PUSH_WORKER_URL){ console.info('[signflow] Push skipped — PUSH_WORKER_URL not configured yet.'); return; }
  try{
    await fetch(PUSH_WORKER_URL + '/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, title, body, key: PUSH_WORKER_SECRET })
    });
  }catch(err){ console.error('[signflow] push send failed', err); }
}
function findPersonById(id){ return state.roster.find(p=>p.id===id) || null; }
// חותם שתורו הגיע (זרימה טורית: כשמתפנה אליו התור; זרימה מקבילה: לכולם מיד עם השליחה, כי כולם פעילים מהרגע הראשון)
async function notifySignerTurn(env, signer){
  const person = findPersonById(signer.id);
  if(!person || !person.fcmToken) return;
  await sendPushViaWorker(person.fcmToken, 'מסמך ממתין לחתימתך', `הגיע תורך לחתום על "${env.title}"`);
}
// בעל המסמך (מי ששלח אותו) מקבל עדכון על כל חתימה שמתקבלת
async function notifyOwnerSigned(env, signer){
  if(!env.createdById || env.createdById===signer.id) return;
  const owner = findPersonById(env.createdById);
  if(!owner || !owner.fcmToken) return;
  await sendPushViaWorker(owner.fcmToken, 'התקבלה חתימה', `${signer.name} חתם/ה על "${env.title}"`);
}
// בעל המסמך מקבל עדכון כשכל סבב החתימות הושלם
async function notifyOwnerCompleted(env){
  if(!env.createdById) return;
  const owner = findPersonById(env.createdById);
  if(!owner || !owner.fcmToken) return;
  await sendPushViaWorker(owner.fcmToken, 'המסמך הושלם', `כלל החותמים סיימו לחתום על "${env.title}"`);
}

const app = document.getElementById('app');

async function init(){

function attachRealtimeListeners(){
  try{
    const { collection, onSnapshot } = window.__fb.firestoreMod;
    onSnapshot(collection(fbDb,'envelopes'), async ()=>{
      await refreshEnvelopes();
      if(state.tab==='dashboard') render();
    });
    onSnapshot(collection(fbDb,'roster'), async ()=>{
      await refreshRoster();
      renderIdentitySwitcher();
      if(state.tab==='admin') renderAdminPage();
      if(state.tab==='upload') renderUploadPage();
    });
  }catch(err){ console.error('[signflow] realtime listener setup failed', err); }
}
async function refreshEnvelopes(){
  const ids = await StorageAPI.listEnvelopeIds();
  const list = [];
  for(const id of ids){ const e = await StorageAPI.getEnvelope(id); if(e) list.push(e); }
  list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  state.envelopes = list;
}
async function refreshRoster(){ state.roster = await StorageAPI.getRoster(); }

/* ---------------- permissions (demo identity simulation) ---------------- */
function getCurrentUser(){
  if(!state.currentUserId) return null;
  return state.roster.find(p=>p.id===state.currentUserId) || null;
}
function getAllowedTabs(){
  const u = getCurrentUser();
  if(!u) return ['upload','dashboard','admin'];           // no identity selected → unrestricted bootstrap/admin mode
  if(u.role==='admin') return ['upload','dashboard','admin'];
  if(u.role==='sender') return ['upload'];
  if(u.role==='signer') return ['dashboard','upload'];
  return ['upload','dashboard','admin'];
}
function defaultTabForUser(u){
  if(!u) return 'upload';
  if(u.role==='signer') return 'dashboard';
  if(u.role==='sender') return 'upload';
  return 'upload'; // admin
}
const TAB_LABELS = { upload:'העלאת מסמכים', dashboard:'מסמכים לחתימה', admin:'ניהול משתמשים' };
function renderNavTabs(){
  const nav = document.getElementById('navTabs');
  if(!nav) return;
  const allowed = getAllowedTabs();
  nav.innerHTML = allowed.map(t=>`<button data-tab="${t}" class="${state.tab===t?'active':''}">${TAB_LABELS[t]}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
}
function renderIdentitySwitcher(){
  const wrap = document.getElementById('identitySwitcher');
  if(!wrap) return;
  const options = [`<option value="">🔓 מצב מנהל (לא מזוהה)</option>`]
    .concat(state.roster.map(p=>`<option value="${p.id}" ${state.currentUserId===p.id?'selected':''}>${escapeHtml(p.name)} — ${ROLE_LABEL[p.role]}</option>`));
  wrap.innerHTML = `<span class="id-label">מחובר/ת כ:</span><select id="identity-select">${options.join('')}</select>`;
  document.getElementById('identity-select').value = state.currentUserId || '';
  document.getElementById('identity-select').addEventListener('change', async (e)=>{
    state.currentUserId = e.target.value || null;
    await StorageAPI.setCurrentUserId(state.currentUserId);
    const allowed = getAllowedTabs();
    state.tab = defaultTabForUser(getCurrentUser());
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
    state.currentEnvId = null;
    renderNavTabs();
    render();
    toast('זהות עודכנה — כעת מחובר/ת כ' + (getCurrentUser() ? escapeHtml(getCurrentUser().name) : 'מנהל (לא מזוהה)'));
  });
}

function switchTab(tab){
  if(!getAllowedTabs().includes(tab)) return; // no permission to view this interface
  state.tab = tab;
  renderNavTabs();
  if(tab==='dashboard') state.currentEnvId = null;
  if(tab==='upload' && !state.draft) resetDraft();
  render();
}
async function refreshPermissionsUI(){
  if(state.currentUserId && !state.roster.find(p=>p.id===state.currentUserId)){
    state.currentUserId = null;
    await StorageAPI.setCurrentUserId(null);
  }
  const allowed = getAllowedTabs();
  if(!allowed.includes(state.tab)){
    state.tab = defaultTabForUser(getCurrentUser());
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
  }
  renderNavTabs();
  renderIdentitySwitcher();
}

function resetDraft(){

function bindUploadEvents(){
  const d = state.draft;
  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('f-file');
  dz?.addEventListener('click', ()=>fileInput.click());
  dz?.addEventListener('dragover', e=>{e.preventDefault(); dz.classList.add('drag');});
  dz?.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz?.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  document.getElementById('btn-replace-doc')?.addEventListener('click', ()=>fileInput.click());
  fileInput?.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
  document.getElementById('f-title')?.addEventListener('input', e=>{ d.title=e.target.value; syncSendBtn(); });
  document.getElementById('btn-goto-admin')?.addEventListener('click', ()=>switchTab('admin'));

  document.getElementById('f-flow')?.addEventListener('change', e=>{ d.flowType=e.target.value; renderUploadPage(); });
  document.querySelectorAll('[data-toggle-signer]').forEach(row=>row.addEventListener('click', ()=>{
    const id = row.dataset.toggleSigner;
    const idx = d.signerIds.indexOf(id);
    if(idx>=0){ d.signerIds.splice(idx,1); d.fields = d.fields.filter(f=>f.fieldSignerId!==id); }
    else d.signerIds.push(id);
    renderUploadPage();
  }));
  document.querySelectorAll('[data-move-signer]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id=b.dataset.id, dir=+b.dataset.moveSigner;
    const idx=d.signerIds.indexOf(id), j=idx+dir;
    if(j<0||j>=d.signerIds.length) return;
    [d.signerIds[idx],d.signerIds[j]]=[d.signerIds[j],d.signerIds[idx]];
    renderUploadPage();
  }));

  document.getElementById('toggle-fields-row')?.addEventListener('click', (e)=>{
    if(e.target.closest('[data-toggle-signer]')) return;
    state.fieldsEnabled = !state.fieldsEnabled;
    state.placingSignerId = null;
    renderUploadPage();
  });

  document.getElementById('btn-prev-page')?.addEventListener('click', (e)=>{ e.stopPropagation(); if(state.currentPage>1){ state.currentPage--; renderUploadPage(); } });
  document.getElementById('btn-next-page')?.addEventListener('click', (e)=>{ e.stopPropagation(); if(state.currentPage<d.pageCount){ state.currentPage++; renderUploadPage(); } });
  document.getElementById('btn-start-place')?.addEventListener('click', (e)=>{
    e.stopPropagation();
    const signerId = document.getElementById('f-field-signer-select')?.value;
    if(!signerId){ toast('בחרו חותם'); return; }
    state.placingSignerId = state.placingSignerId ? null : signerId;
    renderUploadPage();
  });
  document.querySelectorAll('[data-del-field]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    d.fields.splice(+b.dataset.delField,1);
    renderUploadPage();
  }));
  const pageWrap = document.getElementById('pdfPageWrap');
  pageWrap?.addEventListener('click', (e)=>{
    if(!state.placingSignerId) return;
    if(e.target.closest('.field-box')) return;
    const rect = pageWrap.getBoundingClientRect();
    const xPct = (e.clientX-rect.left)/rect.width, yPct = (e.clientY-rect.top)/rect.height;
    const wPct=0.22, hPct=0.06;
    d.fields.push({ id:uid(), fieldSignerId: state.placingSignerId, page: state.currentPage,
      xPct: Math.max(0,Math.min(1-wPct,xPct-wPct/2)), yPct: Math.max(0,Math.min(1-hPct,yPct-hPct/2)),
      wPct, hPct, signatureDataUrl:'', filledAt:null });
    state.placingSignerId = null;
    renderUploadPage();
  });

  document.getElementById('btn-send-envelope')?.addEventListener('click', sendEnvelope);
  syncSendBtn();
}
function syncSendBtn(){
  const d = state.draft;
  const btn = document.getElementById('btn-send-envelope');
  if(btn) btn.disabled = !(d.documentBase64 && d.title.trim() && d.signerIds.length>0);
}

async function handleFile(file){
  const nameLower = (file.name||'').toLowerCase();
  const looksLikePdfExt = nameLower.endsWith('.pdf');
  const looksLikePdfType = file.type === 'application/pdf';
  if(!looksLikePdfExt || (file.type && !looksLikePdfType)){
    toastError('יש להעלות קבצים בפורמט PDF בלבד. הקובץ שנבחר (' + (file.name||'ללא שם') + ') אינו PDF.');
    const fi = document.getElementById('f-file'); if(fi) fi.value = '';
    return;
  }
  if(file.size > 20*1024*1024){ toastError('הקובץ גדול מדי (מקסימום 20MB)'); return; }
  if(usingCloudBackend && file.size > FIRESTORE_SAFE_PDF_BYTES){
    toastError(`המסמך (${(file.size/1024).toFixed(0)}KB) גדול מדי לאחסון ב-Firestore (מגבלה ~${(FIRESTORE_SAFE_PDF_BYTES/1024).toFixed(0)}KB בתצורה הנוכחית, ללא Firebase Storage). נסו לדחוס את ה-PDF או להשתמש בקובץ קטן יותר.`);
    return;
  }
  const buf = await file.arrayBuffer();
  const base64 = bufToBase64(buf);
  try{
    const pdf = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
    state.draft.documentName = file.name;
    state.draft.documentBase64 = base64;
    state.draft.pageCount = pdf.numPages;
    if(!state.draft.title) state.draft.title = file.name.replace(/\.pdf$/i,'');
    toast('המסמך נטען בהצלחה — ' + pdf.numPages + ' עמודים');
    renderUploadPage();
  }catch(err){ console.error(err); toastError('שגיאה בקריאת קובץ ה-PDF — ייתכן שהקובץ פגום או אינו PDF תקין.'); }
}

async function renderPdfIntoEditor(){
  const d = state.draft;
  if(!d.documentBase64) return;
  const canvas = document.getElementById('pdfCanvas');
  if(!canvas) return;
  try{
    const buf = base64ToBuf(d.documentBase64);
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const page = await pdf.getPage(state.currentPage);
    const viewport = page.getViewport({scale:1});
    const scale = 640/viewport.width;
    const sv = page.getViewport({scale});
    canvas.width = sv.width; canvas.height = sv.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport:sv}).promise;
  }catch(err){ console.error(err); }
}

/* ================= SEND ================= */
async function sendEnvelope(){
  const d = state.draft;
  const signers = d.signerIds.map(id=>{
    const p = state.roster.find(r=>r.id===id);
    return { id: p.id, name:p.name, email:p.email, phone:p.phone||'', internal:p.internal!==false, status:'pending', signedAt:null, declinedAt:null, declineReason:'', activatedAt:null, reminderSent:false };
  });
  // Fields only exist here if the sender manually placed them (section 3 toggle).
  // Signers with no pre-placed field will choose their own signing location when they open the document.
  const fields = d.fields.slice();

  const creator = getCurrentUser();
  const env = {
    id: d.id, title: d.title, flowType: d.flowType,
    documentName: d.documentName, documentBase64: d.documentBase64, pageCount: d.pageCount,
    signers, fields, status:'Sent', createdAt: nowISO(), sentAt: nowISO(), completedAt:null,
    finalPdfBase64:'', finalHash:'', auditLog:[],
    createdById: creator ? creator.id : null, createdByName: creator ? creator.name : 'לא ידוע',
  };
  env.originalHash = await sha256(base64ToBuf(env.documentBase64));
  addAudit(env, 'system', `המסמך "${env.title}" נוצר ונשלח לחתימה (${env.flowType==='sequential'?'טורית':'מקבילה'})`);
  if(env.flowType==='sequential'){ if(env.signers[0]){ env.signers[0].status='active'; env.signers[0].activatedAt=nowISO(); } }
  else { const ts=nowISO(); env.signers.forEach(s=>{ s.status='active'; s.activatedAt=ts; }); }

  try{
    await StorageAPI.saveEnvelope(env);
  }catch(err){
    console.error('[signflow] sendEnvelope failed', err);
    toastError('שליחת המסמך נכשלה — ייתכן שהקובץ גדול מדי לאחסון ב-Firestore. פרטים בקונסולת הדפדפן.');
    return;
  }
  await refreshEnvelopes();
  toast('המסמך נשלח בהצלחה 🎉');
  // התראת "הגיע תורך לחתום": בזרימה טורית — רק לחותם הראשון; בזרימה מקבילה — לכולם מיד, כי כולם פעילים מהרגע הראשון
  if(env.flowType==='sequential'){ if(env.signers[0]) notifySignerTurn(env, env.signers[0]); }
  else { env.signers.forEach(s=>notifySignerTurn(env, s)); }
  resetDraft();
  state.currentEnvId = env.id;
  switchTab('dashboard');
}
function addAudit(env, actor, action){ env.auditLog.push({ ts: nowISO(), actor, action }); }

/* ---------------- Excel roster import ---------------- */
const HEADER_SYNONYMS = {
  name: ['שם','שם מלא','name','full name','fullname'],
  email: ['מייל','אימייל','דואר אלקטרוני','email','e-mail','mail'],
  phone: ['טלפון','נייד','טלפון נייד','phone','mobile','tel','cell'],
  role: ['הרשאה','רמת הרשאה','תפקיד','role','permission','permission level'],
  internal: ['סוג','פנימי/חיצוני','internal','type'],
};
function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/["'\.]/g,''); }
function matchField(headerKey){
  const norm = normalizeHeader(headerKey);
  for(const field in HEADER_SYNONYMS){
    if(HEADER_SYNONYMS[field].some(syn => normalizeHeader(syn)===norm)) return field;
  }
  return null;
}
function mapRoleValue(raw){
  const v = String(raw||'').trim().toLowerCase();
  if(!v) return 'signer';
  if(v.includes('מנהל') || v.includes('admin')) return 'admin';
  if(v.includes('שולח') || v.includes('sender')) return 'sender';
  if(v.includes('חותם') || v.includes('signer')) return 'signer';
  return 'signer';
}
function mapInternalValue(raw){
  const v = String(raw||'').trim().toLowerCase();
  if(v.includes('חיצ') || v.includes('external')) return false;
  return true;
}

async function handleRosterImportFile(file){
  if(file.size > 5*1024*1024){ toast('הקובץ גדול מדי (מקסימום 5MB)'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){ toast('לא נמצאו שורות בקובץ'); return; }

    // map header keys of the first row to our fields
    const sampleKeys = Object.keys(rows[0]);
    const fieldByHeader = {};
    sampleKeys.forEach(h=>{ const f = matchField(h); if(f) fieldByHeader[h]=f; });

    const existingEmails = new Set(state.roster.map(p=>p.email.trim().toLowerCase()));
    const preview = rows.map(row=>{
      const rec = {name:'', email:'', phone:'', roleRaw:'', internalRaw:''};
      Object.keys(row).forEach(h=>{
        const field = fieldByHeader[h];
        if(!field) return;
        const val = String(row[h]).trim();
        if(field==='name') rec.name = val;
        else if(field==='email') rec.email = val;
        else if(field==='phone') rec.phone = val;
        else if(field==='role') rec.roleRaw = val;
        else if(field==='internal') rec.internalRaw = val;
      });
      return {
        name: rec.name, email: rec.email, phone: rec.phone,
        role: mapRoleValue(rec.roleRaw), internal: mapInternalValue(rec.internalRaw),
        isDuplicate: rec.email ? existingEmails.has(rec.email.toLowerCase()) : false,
        include: !!(rec.name && rec.email),
      };
    }).filter(r => r.name || r.email); // drop fully empty rows

    if(!preview.length){ toast('לא זוהו שורות תקינות — ודאו שהעמודות נקראות שם/אימייל/טלפון/הרשאה'); return; }
    state.importPreview = preview;
    renderAdminPage();
    toast(`זוהו ${preview.length} שורות — סמנו למי לייבא ולחצו על ״ייבוא״`);
  }catch(err){
    console.error(err);
    toast('שגיאה בקריאת קובץ ה-Excel — ודאו שזהו קובץ xlsx/xls/csv תקין');
  }
}

async function confirmRosterImport(){
  const rows = (state.importPreview||[]).filter(r=>r.include && r.name && r.email);
  if(!rows.length){ toast('לא נבחרו שורות לייבוא'); return; }
  let added=0, updated=0;
  for(const r of rows){
    const existing = state.roster.find(p=>p.email.trim().toLowerCase()===r.email.trim().toLowerCase());
    let person;
    if(existing){ Object.assign(existing, {name:r.name, phone:r.phone, role:r.role, internal:r.internal}); person=existing; updated++; }
    else { person = { id:uid(), name:r.name, email:r.email, phone:r.phone, role:r.role, internal:r.internal, signatureImage:'' }; state.roster.push(person); added++; }
    await StorageAPI.upsertPerson(person);
  }
  state.importPreview = null;
  await refreshPermissionsUI();
  toast(`ייבוא הושלם: ${added} משתמשים חדשים, ${updated} עודכנו`);
  render();
}

function downloadBase64Pdf(base64, filename){
  const buf = base64ToBuf(base64); const blob = new Blob([buf], {type:'application/pdf'});

}

async function renderModalPdfPage(env, pageNum){
  const canvas = document.getElementById('modalPdfCanvas');
  if(!canvas) return;
  try{
    const buf = base64ToBuf(env.documentBase64);
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({scale:1});
    const scale = 620/viewport.width;
    const sv = page.getViewport({scale});
    canvas.width = sv.width; canvas.height = sv.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport:sv}).promise;
  }catch(err){ console.error(err); }
}
function bindPlaceStep(env, signer){
  const sm = state.signModal;

    const wPct=0.22, hPct=0.06;
    const field = { id:uid(), fieldSignerId:signer.id, page: sm.placePage,
      xPct: Math.max(0,Math.min(1-wPct,xPct-wPct/2)), yPct: Math.max(0,Math.min(1-hPct,yPct-hPct/2)),
      wPct, hPct, signatureDataUrl:'', filledAt:null };
    env.fields.push(field);
    addAudit(env, signer.name, `בחר/ה מיקום חתימה חופשי בעמוד ${sm.placePage}`);

async function renderFieldPreviewThumbnail(env, field, canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  try{
    const buf = base64ToBuf(env.documentBase64);
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const page = await pdf.getPage(field.page);
    const viewport = page.getViewport({scale:1});
    const targetW = 300;
    const scale = targetW/viewport.width;
    const sv = page.getViewport({scale});
    canvas.width = sv.width; canvas.height = sv.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext:ctx, viewport:sv}).promise;
    const bx = field.xPct*canvas.width, by = field.yPct*canvas.height, bw = field.wPct*canvas.width, bh = field.hPct*canvas.height;
    ctx.fillStyle = 'rgba(168,64,47,0.22)';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle = '#A8402F'; ctx.lineWidth = Math.max(2, canvas.width*0.008);
    ctx.strokeRect(bx,by,bw,bh);
  }catch(err){ console.error('field preview render error', err); }
}
function drawSavedSignatureIntoCanvas(canvas, dataUrl, onChange){
  const img = new Image();
  img.onload = () => {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const pad = 14;
    const maxW = canvas.width - pad*2, maxH = canvas.height - pad*2;
    const scale = Math.min(maxW/img.width, maxH/img.height, 1);
    const dw = img.width*scale, dh = img.height*scale;
    const dx = (canvas.width-dw)/2, dy = (canvas.height-dh)/2;
    ctx.drawImage(img, dx, dy, dw, dh);
    onChange(canvas.toDataURL('image/png'));
  };
  img.onerror = () => toastError('שגיאה בטעינת החתימה השמורה');
  img.src = dataUrl;
}
function bindFillStep(env, signer, myFields){
  const sm = state.signModal;
  const person = state.roster.find(r=>r.id===signer.id);
  const values = {};
  myFields.forEach(f=>{
    const gi = env.fields.indexOf(f);
    const canvas = document.getElementById('sigCanvas-'+gi);
    if(!canvas) return;
    renderFieldPreviewThumbnail(env, f, 'fieldPreview-'+gi);
    setupSignaturePad(canvas, dataUrl => { values[gi]=dataUrl; });
    document.querySelector(`[data-clear-sig="${gi}"]`)?.addEventListener('click', ()=>{
      canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); values[gi]='';
    });
    document.querySelector(`[data-insert-saved-sig="${gi}"]`)?.addEventListener('click', ()=>{
      if(!person || !person.signatureImage) return;
      drawSavedSignatureIntoCanvas(canvas, person.signatureImage, dataUrl => { values[gi]=dataUrl; });
    });
  });
  const foot = document.getElementById('modalFoot');
  foot.innerHTML = `<button class="btn btn-ghost" id="btn-decline">סרב לחתום</button><button class="btn btn-primary" id="btn-fill-continue">המשך לאישור →</button>`;
  document.getElementById('btn-decline').addEventListener('click', async ()=>{
    const reason = prompt('נא לציין סיבת דחייה:');
    if(reason===null) return;
    signer.status='declined'; signer.declinedAt=nowISO(); signer.declineReason=reason||'לא צוינה סיבה';
    env.status='Declined';
    addAudit(env, signer.name, 'החותם דחה את בקשת החתימה: '+(reason||'—'));

    sm.fieldValues = values; sm.step='confirm'; renderSignModal();
  });
}
function setupSignaturePad(canvas, onChange){
  const ctx = canvas.getContext('2d'); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle='#16232B';
  let drawing=false, lastX=0, lastY=0;
  function pos(e){ const r=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:cx*(canvas.width/r.width), y:cy*(canvas.height/r.height)}; }
  function start(e){ drawing=true; const p=pos(e); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function end(){ if(drawing){ drawing=false; onChange(canvas.toDataURL('image/png')); } }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', end);
}

async function findPendingEnvelopesForSigner(signerId, excludeEnvId){
  const ids = await StorageAPI.listEnvelopeIds();
  const pending = [];
  for(const id of ids){
    if(id===excludeEnvId) continue;
    const e = await StorageAPI.getEnvelope(id);
    if(!e) continue;
    if(['Completed','Voided','Declined'].includes(e.status)) continue;
    const s = e.signers.find(x=>x.id===signerId);
    if(s && s.status==='active') pending.push({ id:e.id, title:e.title });
  }
  return pending;
}

async function finalizeSignature(env, signer, myFields){
  const sm = state.signModal;
  try{
    myFields.forEach(f=>{ const gi=env.fields.indexOf(f); const val=sm.fieldValues[gi]; if(val){ f.signatureDataUrl=val; f.filledAt=nowISO(); } });
    signer.status='signed'; signer.signedAt=nowISO();
    addAudit(env, signer.name, 'המסמך נחתם על ידי החותם');
    let nextSigner = null;
    if(env.flowType==='sequential'){
      const idx = env.signers.findIndex(s=>s.id===signer.id); const next=env.signers[idx+1];
      if(next){ next.status='active'; next.activatedAt=nowISO(); addAudit(env,'system', `המסמך הועבר לחותם הבא: ${next.name}`); env.status='InProgress'; nextSigner=next; }
    } else { env.status = env.signers.some(s=>s.status!=='signed') ? 'InProgress' : env.status; }
    const allSigned = env.signers.every(s=>s.status==='signed');
    await StorageAPI.saveEnvelope(env);
    notifyOwnerSigned(env, signer); // עדכון לבעל המסמך שהתקבלה חתימה
    if(nextSigner) notifySignerTurn(env, nextSigner); // הגיע תורו של החותם הבא בזרימה טורית
    if(allSigned){
      await generateFinalPdf(env);
      env.status='Completed'; env.completedAt=nowISO();
      addAudit(env,'system','כלל החותמים השלימו — מסמך חתום סופי הופק וארכב');
      await StorageAPI.saveEnvelope(env);
      notifyOwnerCompleted(env); // עדכון לבעל המסמך שהמסמך הושלם
    }
    await refreshEnvelopes();
    sm.nextPending = await findPendingEnvelopesForSigner(signer.id, env.id);
    sm.step='done'; renderSignModal();
  }catch(err){
    console.error('[signflow] finalizeSignature failed', err);
    toastError('שמירת החתימה נכשלה — ייתכן שהמסמך גדול מדי לאחסון ב-Firestore. פרטים בקונסולת הדפדפן.');
    closeSignModal();
    render();
  }
}

  <h3 style="font-size:18px;">החתימה נקלטה בהצלחה</h3>

/* ================= HEBREW-SAFE TEXT RENDERING FOR CERTIFICATE PAGE ================= */
async function renderCertificatePageImages(env){
  await (document.fonts && document.fonts.ready);
  const W=1240, H=1754;
  const pageImgs = [];
  let lines = [];
  lines.push({t:'תעודת השלמת חתימה  |  Certificate of Completion', size:30, weight:800, gap:46});
  lines.push({t:'כותרת: '+env.title, size:18, weight:600, gap:30});
  lines.push({t:'מסמך: '+env.documentName, size:15, weight:400, gap:26});
  lines.push({t:'נוצר: '+fmtDT(env.createdAt)+'   |   הושלם: '+fmtDT(env.completedAt||nowISO()), size:14, weight:400, gap:24});
  lines.push({t:'סוג זרימה: '+(env.flowType==='sequential'?'טורית':'מקבילה'), size:14, weight:400, gap:34});
  lines.push({t:'חותמים:', size:17, weight:700, gap:30});
  env.signers.forEach(s=>{ lines.push({t:'• '+s.name+'   <'+s.email+'>   נחתם: '+fmtDT(s.signedAt), size:13, weight:400, gap:22}); });
  lines.push({t:' ', size:10, weight:400, gap:14});
  lines.push({t:'Audit Trail:', size:17, weight:700, gap:30});
  env.auditLog.forEach(a=>{ lines.push({t:fmtDT(a.ts)+'  —  '+a.actor+'  —  '+a.action, size:11.5, weight:400, gap:20, muted:true}); });
  lines.push({t:' ', size:10, weight:400, gap:10});
  lines.push({t:'Hash מסמך מקורי (SHA-256): '+(env.originalHash||''), size:9.5, weight:400, gap:18, muted:true, mono:true});

  const margin=70; let idx=0;
  while(idx<lines.length){
    const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    ctx.direction='rtl'; ctx.textAlign='right'; ctx.textBaseline='top';
    let y=margin;
    while(idx<lines.length && y<H-margin){
      const ln=lines[idx];
      ctx.font=`${ln.weight} ${ln.size*2}px ${ln.mono?'monospace':'Heebo, Arial'}`;
      ctx.fillStyle = ln.muted ? '#5C6B72' : '#16232B';
      ctx.fillText(ln.t, W-margin, y);
      y += ln.gap*2; idx++;
    }
    pageImgs.push(canvas.toDataURL('image/png'));
  }
  return pageImgs;
}

/* ================= FINAL PDF GENERATION (signature-only fields) ================= */
async function generateFinalPdf(env){
  try{
    const srcBytes = base64ToBuf(env.documentBase64);
    const pdfDoc = await PDFDocument.load(srcBytes);
    const pages = pdfDoc.getPages();
    for(const f of env.fields){
      if(!f.signatureDataUrl) continue;
      const page = pages[f.page-1]; if(!page) continue;
      const { width, height } = page.getSize();
      const boxX=f.xPct*width, boxYTop=f.yPct*height, boxW=f.wPct*width, boxH=f.hPct*height;
      const boxYBottom = height - boxYTop - boxH;
      try{
        const pngBytes = base64ToBuf(f.signatureDataUrl.split(',')[1]);
        const pngImage = await pdfDoc.embedPng(pngBytes);
        page.drawImage(pngImage, { x:boxX, y:boxYBottom, width:boxW, height:boxH });
      }catch(e){ console.error('sig embed error', e); }
    }
    const certImgs = await renderCertificatePageImages(env);
    for(const dataUrl of certImgs){
      const pngBytes = base64ToBuf(dataUrl.split(',')[1]);
      const pngImage = await pdfDoc.embedPng(pngBytes);
      const p = pdfDoc.addPage([595.28, 841.89]);
      p.drawImage(pngImage, {x:0,y:0,width:595.28,height:841.89});
    }
    const outBytes = await pdfDoc.save();
    env.finalPdfBase64 = bufToBase64(outBytes);
    env.finalHash = await sha256(outBytes);
    if(usingCloudBackend && outBytes.byteLength > FIRESTORE_SAFE_PDF_BYTES){
      toastError('המסמך החתום הסופי גדול מדי לשמירה ב-Firestore — הוא זמין להורדה בסשן הנוכחי, אך לא יסתנכרן לענן. שקלו לעבור ל-Firebase Storage למסמכים גדולים.');
    }
  }catch(err){ console.error('final pdf generation failed', err); toast('שגיאה בהפקת המסמך הסופי — נא לבדוק את קונסולת הדפדפן'); }
}
