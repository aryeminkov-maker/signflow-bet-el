<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חתימה+ | מערכת חתימה דיגיטלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16232B; --ink-soft:#3C4E58; --paper:#F5F3EE; --paper-raised:#FFFFFF;
  --line:#DAD5C8; --seal:#A8402F; --seal-dark:#7E2E21; --moss:#3B6E5E; --moss-soft:#DCE9E3;
  --amber:#B4802E; --amber-soft:#F3E6CC; --gray:#8A8478;
  --shadow: 0 1px 2px rgba(22,35,43,.06), 0 8px 24px rgba(22,35,43,.08);
  --radius: 10px; --serif: 'Frank Ruhl Libre','David',serif; --sans:'Heebo',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;direction:rtl;}
::selection{background:var(--seal);color:#fff;}
a{color:inherit;} button{font-family:inherit;cursor:pointer;}
.shell{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
header.topbar{border-bottom:1px solid var(--line);background:var(--paper-raised);position:sticky;top:0;z-index:40;}
.topbar-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.topbar-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;max-width:100%;flex:1 1 100%;}
.brand-mark{height:38px;width:auto;flex:none;object-fit:contain;}
.brand-text{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--gray);letter-spacing:.5px;margin-top:-2px;}
nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{border:none;background:transparent;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.15s;white-space:nowrap;flex:none;}
nav.tabs button.active{background:var(--ink);color:#fff;}
.nav-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;margin-inline-start:5px;background:var(--seal);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;vertical-align:middle;}
.identity-switcher{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:100%;min-width:0;}
.identity-switcher select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;font-family:inherit;max-width:min(230px,60vw);color:var(--ink);}
.identity-switcher .id-label{font-size:11px;color:var(--gray);white-space:nowrap;}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.status-pill.status-ok{background:#DCE9E3;color:#265144;border:1px solid #BFDBCF;}
.status-pill.status-bad{background:#F6DCD8;color:#7E2E21;border:1px solid #ECB7AE;}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0 0 8px;}
.page-title{font-size:30px;margin:32px 0 6px;}
.page-sub{color:var(--ink-soft);font-size:15px;margin-bottom:28px;}
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:22px 24px;}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;border:1px solid transparent;padding:11px 20px;font-size:14.5px;font-weight:600;transition:.15s;}
.btn-primary{background:var(--ink);color:#fff;} .btn-primary:hover{background:#0d181e;}
.btn-seal{background:var(--seal);color:#fff;} .btn-seal:hover{background:var(--seal-dark);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);} .btn-ghost:hover{background:#EFEBE1;}
.btn-danger{background:transparent;color:var(--seal);border-color:#E7C9C2;} .btn-danger:hover{background:#FBEEEC;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:7px 14px;font-size:13px;}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit;font-size:14.5px;color:var(--ink);}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--moss);outline-offset:1px;}
label.field-label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field-group{margin-bottom:16px;}
.hint{font-size:12.5px;color:var(--gray);margin-top:5px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;}
.badge-draft{background:#EAE7DF;color:#6B655A;}
.badge-sent{background:var(--amber-soft);color:#7A5A1E;}
.badge-progress{background:#E4EEF7;color:#2E5E82;}
.badge-completed{background:var(--moss-soft);color:#265144;}
.badge-declined{background:#F7E3E0;color:var(--seal-dark);}
.badge-voided{background:#EFEBE1;color:#8A8478;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.role-admin{background:#F7E3E0;color:var(--seal-dark);}
.role-sender{background:var(--amber-soft);color:#7A5A1E;}
.role-signer{background:var(--moss-soft);color:#265144;}
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:8px;}
.env-card{padding:18px 20px;cursor:pointer;transition:.15s;}
.env-card:hover{border-color:var(--ink);transform:translateY(-1px);}
.env-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.env-card h3{font-size:17px;margin:0;}
.env-meta{font-size:12.5px;color:var(--gray);margin-top:4px;}
.progress-track{height:6px;background:#EDEAE1;border-radius:99px;margin-top:14px;overflow:hidden;}
.progress-fill{height:100%;background:var(--moss);border-radius:99px;transition:.4s;}
.empty-state{text-align:center;padding:70px 20px;color:var(--gray);}
.empty-state .seal-icon{width:56px;height:56px;margin:0 auto 16px;opacity:.5;}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:46px 20px;text-align:center;background:#FBFAF6;transition:.15s;cursor:pointer;}
.dropzone.drag{border-color:var(--seal);background:#FBEEEC;}
.dropzone svg{opacity:.55;margin-bottom:10px;}
.signer-check-row{display:flex;gap:10px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;}
.signer-check-row.sel{border-color:var(--moss);background:var(--moss-soft);}
.signer-order{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
.signer-info{flex:1;min-width:0;}
.signer-info .nm{font-weight:600;font-size:14px;}
.signer-info .em{font-size:12.5px;color:var(--gray);}
.icon-btn{border:none;background:transparent;color:var(--gray);padding:6px;border-radius:6px;line-height:0;}
.icon-btn:hover{background:#EFEBE1;color:var(--ink);}
.editor-shell{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start;}
@media (max-width:900px){.editor-shell{grid-template-columns:1fr;}}
.pdf-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px;}
.page-nav{display:flex;align-items:center;gap:10px;font-size:13.5px;}
.pdf-stage{position:relative;background:#3a3a3a;border-radius:var(--radius);overflow:auto;display:flex;justify-content:center;padding:20px;}
.pdf-page-wrap{position:relative;box-shadow:0 4px 20px rgba(0,0,0,.35);background:#fff;}
.pdf-page-wrap canvas{display:block;}
.field-box{position:absolute;border:1.5px solid var(--seal);background:rgba(168,64,47,.10);border-radius:4px;font-size:10.5px;color:var(--seal-dark);font-weight:700;display:flex;align-items:center;justify-content:center;cursor:grab;padding:2px;text-align:center;overflow:hidden;touch-action:none;user-select:none;}
.field-box:active{cursor:grabbing;}
.field-box .del{cursor:pointer;}
.field-box .del{position:absolute;top:-9px;left:-9px;background:var(--ink);color:#fff;width:16px;height:16px;border-radius:50%;font-size:11px;line-height:16px;text-align:center;}
.field-list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:12.5px;background:#fff;}
.field-list-item .sw{width:8px;height:8px;border-radius:2px;flex:none;background:var(--seal);}
table.audit{width:100%;border-collapse:collapse;font-size:13px;}
table.audit th{text-align:right;color:var(--gray);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;}
table.audit td{padding:9px 10px;border-bottom:1px solid #EFEBE1;}
table.audit tr:last-child td{border-bottom:none;}
.mono{font-family:ui-monospace,'Courier New',monospace;font-size:11.5px;color:var(--gray);}
.signer-status-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFEBE1;}
.signer-status-row:last-child{border-bottom:none;}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.status-dot.pending{background:#D9D3C4;} .status-dot.active{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);}
.status-dot.signed{background:var(--moss);} .status-dot.declined{background:var(--seal);}
.modal-overlay{position:fixed;inset:0;background:rgba(22,35,43,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.modal{background:var(--paper-raised);border-radius:14px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal-head{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:24px 26px;} .modal-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.auth-gate{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-gate-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08);}
.otp-demo-note{background:var(--amber-soft);border:1px solid #E4CE9C;border-radius:8px;padding:12px 14px;font-size:13px;color:#5C4318;margin-bottom:14px;}
.sig-pad-wrap{border:1.5px dashed var(--line);border-radius:10px;background:#fff;position:relative;}
.sig-pad-wrap canvas{width:100%;height:180px;display:block;cursor:crosshair;touch-action:none;}
.sig-baseline{position:absolute;left:24px;right:24px;bottom:34px;border-bottom:1px solid #D9D3C4;pointer-events:none;}
.seal-stamp{width:120px;height:120px;margin:0 auto 14px;border:3px solid var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--seal);font-family:var(--serif);font-weight:900;font-size:15px;text-align:center;line-height:1.3;transform:rotate(-8deg);opacity:0;animation:stampIn .5s ease-out .1s forwards;}
@keyframes stampIn{0%{opacity:0;transform:rotate(-8deg) scale(2.4);}70%{opacity:1;}100%{opacity:.92;transform:rotate(-8deg) scale(1);}}
.checklist-item{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;padding:8px 0;}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);animation:toastIn .2s ease-out;}
.toast.toast-error{background:var(--seal);font-weight:600;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.section-nav-back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-bottom:14px;background:none;border:none;padding:0;}
.section-nav-back:hover{color:var(--ink);}
.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start;}
@media (max-width:880px){.detail-grid{grid-template-columns:1fr;}}
.stat-line{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid #EFEBE1;}
.stat-line:last-child{border-bottom:none;} .stat-line b{font-weight:600;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.section-block{margin-bottom:22px;}
.section-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;margin-left:10px;}
.section-heading{display:flex;align-items:center;font-size:17px;font-family:var(--serif);font-weight:700;margin-bottom:14px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.switch{width:40px;height:22px;border-radius:99px;background:#D9D3C4;position:relative;flex:none;transition:.2s;}
.switch.on{background:var(--moss);}
.switch::after{content:'';position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on::after{right:20px;}
.disabled-block{opacity:.5;pointer-events:none;}
.roster-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.roster-table th{text-align:right;color:var(--gray);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;}
.roster-table td{padding:10px;border-bottom:1px solid #EFEBE1;vertical-align:middle;}
.import-row.dup{background:#FBF3E4;}
.import-row.excluded{opacity:.4;}
.import-dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 20px;text-align:center;background:#FBFAF6;cursor:pointer;transition:.15s;}
@media (max-width:480px){
  .topbar-inner{padding:12px 14px;}
  .topbar-controls{width:100%;}
  nav.tabs{width:100%;}
  nav.tabs button{flex:1 1 0;text-align:center;padding:8px 6px;font-size:12.5px;}
  .identity-switcher{width:100%;justify-content:center;}
  .identity-switcher select{max-width:45vw;}
}
.import-dropzone.drag{border-color:var(--seal);background:#FBEEEC;}
.tag-new{background:var(--moss-soft);color:#265144;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
.tag-update{background:var(--amber-soft);color:#7A5A1E;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
</style>
</head>

/* ---------------- storage portability shim ----------------
   window.storage is Claude's built-in artifact persistence API and only
   exists when this file runs inside a Claude.ai conversation. When this
   file is deployed standalone (Netlify, GitHub Pages, opened locally, etc.)
   we transparently back it with localStorage instead, so the exact same
   file works in both places. Per-browser only when running standalone —
   data will not sync across different computers/users in that mode. */
if(!window.storage){
  const LS_PREFIX = 'signflow:';
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem(LS_PREFIX+key);
      if(raw===null) throw new Error('key not found: '+key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(LS_PREFIX+key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(LS_PREFIX+key);
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = Object.keys(localStorage)
        .filter(k=>k.startsWith(LS_PREFIX+(prefix||'')))
        .map(k=>k.slice(LS_PREFIX.length));
      return { keys, prefix, shared: !!shared };
    }
  };
}

async function sha256(bytesOrString){
  let buf = typeof bytesOrString === 'string' ? new TextEncoder().encode(bytesOrString) : bytesOrString;
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function bufToBase64(buf){ let binary=''; const bytes=new Uint8Array(buf); for(let i=0;i<bytes.byteLength;i++) binary+=String.fromCharCode(bytes[i]); return btoa(binary); }
function base64ToBuf(b64){ const binary=atob(b64); const bytes=new Uint8Array(binary.length); for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i); return bytes.buffer; }

/* ---------------- storage: local backend (this browser only) ---------------- */
const LocalStorageAPI = {
  async listEnvelopeIds(){ try{ const r=await window.storage.get('envelope-index'); return r?JSON.parse(r.value):[]; }catch(e){ return []; } },
  async saveIndex(ids){ await window.storage.set('envelope-index', JSON.stringify(ids)); },
  async getEnvelope(id){ try{ const r=await window.storage.get('envelope:'+id); return r?JSON.parse(r.value):null; }catch(e){ return null; } },
  async saveEnvelope(env){ await window.storage.set('envelope:'+env.id, JSON.stringify(env)); const ids=await this.listEnvelopeIds(); if(!ids.includes(env.id)){ ids.unshift(env.id); await this.saveIndex(ids); } },
  async getRoster(){ try{ const r=await window.storage.get('roster'); return r?JSON.parse(r.value):[]; }catch(e){ return []; } },
  async upsertPerson(person){
    const list = await this.getRoster();
    const idx = list.findIndex(p=>p.id===person.id);
    if(idx>=0) list[idx]=person; else list.push(person);
    await window.storage.set('roster', JSON.stringify(list));
  },
  async deletePerson(id){
    const list = (await this.getRoster()).filter(p=>p.id!==id);
    await window.storage.set('roster', JSON.stringify(list));
  },
  async getCurrentUserId(){ try{ const r=await window.storage.get('current-user-id'); return r && r.value ? r.value : null; }catch(e){ return null; } },
  async setCurrentUserId(id){ await window.storage.set('current-user-id', id||''); }
};

let fbApp=null, fbDb=null, fbAuth=null;

async function tryInitFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY"){
    console.info('[signflow] Firebase not configured — using local browser storage.');
    return false;
  }
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    fbApp = initializeApp(firebaseConfig);
    fbDb = firestoreMod.getFirestore(fbApp);
    fbAuth = authMod.getAuth(fbApp);
    // No anonymous sign-in anymore: real identity now comes from Google Sign-In
    // (see listenForAuthChanges / signInWithGoogle below), which already satisfies
    // Firestore's "request.auth != null" rule on its own.
    window.__fb = { firestoreMod, authMod }; // keep module refs reachable for CloudStorageAPI below
    console.info('[signflow] Connected to Firebase project (Firestore only, free Spark plan):', firebaseConfig.projectId);
    return true;
  }catch(err){
    console.error('[signflow] Firebase init failed, falling back to local storage:', err);
    toastError('החיבור ל-Firebase נכשל — עובד במצב מקומי בלבד. פרטים בקונסולת הדפדפן.');
    return false;
  }
}

async function signInWithGoogle(){
  try{
    const { GoogleAuthProvider, signInWithPopup } = window.__fb.authMod;
    await signInWithPopup(fbAuth, new GoogleAuthProvider());
  }catch(err){
    console.error('[signflow] Google sign-in failed', err);
    toastError('ההתחברות עם Google נכשלה: ' + err.message);
  }
}
async function signOutUser(){
  try{ await window.__fb.authMod.signOut(fbAuth); }catch(err){ console.error('[signflow] sign-out failed', err); }
}

/* PDFs are stored directly inside the Firestore document (base64) so the whole
   backend runs on the free Spark plan — no Firebase Storage / Blaze plan needed.
   Firestore caps each document at 1MB, so we keep a safety margin here and
   warn the user client-side before they even try to upload a file that's too big. */

const CloudStorageAPI = {
  async listEnvelopeIds(){
    const { collection, getDocs } = window.__fb.firestoreMod;
    const snap = await getDocs(collection(fbDb,'envelopes'));
    return snap.docs.map(d=>d.id);
  },
  async getEnvelope(id){
    const { doc, getDoc } = window.__fb.firestoreMod;
    const snap = await getDoc(doc(fbDb,'envelopes',id));
    if(!snap.exists()) return null;
    return { id, ...snap.data() };
  },
  async saveEnvelope(env){
    const { doc, setDoc } = window.__fb.firestoreMod;
    const toSave = { ...env };
    delete toSave.id;
    await setDoc(doc(fbDb,'envelopes',env.id), toSave);
  },
  async getRoster(){
    const { collection, getDocs } = window.__fb.firestoreMod;
    const snap = await getDocs(collection(fbDb,'roster'));
    return snap.docs.map(d=>({ id:d.id, ...d.data() }));
  },
  async upsertPerson(person){
    const { doc, setDoc } = window.__fb.firestoreMod;
    const data = {
      name: person.name||'', email: person.email||'', phone: person.phone||'',
      role: person.role||'signer', internal: person.internal!==false,
      signatureImage: person.signatureImage||'',
      // שדות התראות Push — נשמרים כאן במפורש כדי שלא יימחקו בכל עריכת פרופיל דרך savePerson
      fcmToken: person.fcmToken||null, notificationsEnabledAt: person.notificationsEnabledAt||null,
    };
    await setDoc(doc(fbDb,'roster',person.id), data);
  },
  async deletePerson(id){
    const { doc, deleteDoc } = window.__fb.firestoreMod;
    await deleteDoc(doc(fbDb,'roster',id));
  },
  // "who am I pretending to be" is a per-device UI convenience, not shared org data — keep it local
  async getCurrentUserId(){ return localStorage.getItem('signflow:current-user-id') || null; },
  async setCurrentUserId(id){ localStorage.setItem('signflow:current-user-id', id||''); }
};

const FCM_VAPID_KEY = 'BHs2ozCLJr3hGVRdeqGP08FspcDqGYbRMmd-2FUWwSitH2koxXBm-Bycp_qssKURdiDUye_YgDuQQXAK6QBtpS8';

let fbMessaging = null; // cached { mod, instance } once initialized
async function tryGetMessaging(){
  if(!usingCloudBackend) return null; // tokens are stored on roster docs in Firestore — needs the cloud backend
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return null;
  if(fbMessaging) return fbMessaging;
  try{
    const messagingMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    fbMessaging = { mod: messagingMod, instance: messagingMod.getMessaging(fbApp) };
    return fbMessaging;
  }catch(err){
    console.error('[signflow] Firebase Messaging init failed', err);
    return null;
  }
}

async function enablePushNotifications(){
  const cu = getCurrentUser();
  if(!cu){ toast('יש לבחור זהות דרך "מחובר/ת כ:" לפני הפעלת התראות'); return; }
  if(!FCM_VAPID_KEY){ toastError('התראות טרם הוגדרו סופית באתר (חסר מפתח VAPID) — זו הודעה למפתח האתר, לא תקלה אצלכם.'); return; }
  const fbm = await tryGetMessaging();
  if(!fbm){ toastError('הדפדפן הזה לא תומך בהתראות Push, או שהאתר עדיין לא רץ ב-HTTPS. באייפון/Safari יש להתקין קודם את האתר למסך הבית.'); return; }
  try{
    const permission = await Notification.requestPermission();
    if(permission!=='granted'){ toast('לא אושרה הרשאת התראות. אפשר לאשר בהמשך דרך הגדרות הדפדפן.'); return; }
    const reg = await navigator.serviceWorker.register('./sw.js');
    const token = await fbm.mod.getToken(fbm.instance, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) throw new Error('לא התקבל טוקן התראות מהדפדפן');
    cu.fcmToken = token; cu.notificationsEnabledAt = nowISO();
    await StorageAPI.upsertPerson(cu);
    await refreshRoster();
    toast('התראות הופעלו בהצלחה 🔔');
    render();
  }catch(err){
    console.error('[signflow] enablePushNotifications failed', err);
    toastError('שגיאה בהפעלת התראות: ' + err.message);
  }
}
async function disablePushNotifications(){
  const cu = getCurrentUser();
  if(!cu) return;
  try{
    const fbm = await tryGetMessaging();
    if(fbm){ try{ await fbm.mod.deleteToken(fbm.instance); }catch(e){ /* לא קריטי אם נכשל */ } }
    cu.fcmToken = '';
    await StorageAPI.upsertPerson(cu);
    await refreshRoster();
    toast('התראות בוטלו');
    render();
  }catch(err){
    console.error('[signflow] disablePushNotifications failed', err);
    toastError('שגיאה בביטול התראות: ' + err.message);
  }
}

async function sendPushViaWorker(token, title, body){
  if(!token) return;
  if(!PUSH_WORKER_URL){ console.info('[signflow] Push skipped — PUSH_WORKER_URL not configured yet.'); return; }
  try{
    await fetch(PUSH_WORKER_URL + '/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, title, body, key: PUSH_WORKER_SECRET })
    });
  }catch(err){ console.error('[signflow] push send failed', err); }
}
function findPersonById(id){ return state.roster.find(p=>p.id===id) || null; }

async function notifySignerTurn(env, signer){
  const person = findPersonById(signer.id);
  if(!person || !person.fcmToken) return;
  await sendPushViaWorker(person.fcmToken, 'מסמך ממתין לחתימתך', `הגיע תורך לחתום על "${env.title}"`);
}
// בעל המסמך (מי ששלח אותו) מקבל עדכון על כל חתימה שמתקבלת
async function notifyOwnerSigned(env, signer){
  if(!env.createdById || env.createdById===signer.id) return;
  const owner = findPersonById(env.createdById);
  if(!owner || !owner.fcmToken) return;
  await sendPushViaWorker(owner.fcmToken, 'התקבלה חתימה', `${signer.name} חתם/ה על "${env.title}"`);
}

  if(!env.createdById) return;
  const owner = findPersonById(env.createdById);
  if(!owner || !owner.fcmToken) return;
  await sendPushViaWorker(owner.fcmToken, 'המסמך הושלם', `כלל החותמים סיימו לחתום על "${env.title}"`);
}

async function init(){

    renderBackendBadge();

  }
  // local fallback (Firebase not configured / connection failed) — app is now considered "down"
  renderBackendBadge();

  state.currentUserId = await StorageAPI.getCurrentUserId();

/* ---------------- Google Sign-In gate (cloud mode only) ----------------
   Real identity now comes from the signed-in Google account's email, matched
   against the roster. No match → blocked with a clear message (an admin needs
   to add that email to the roster first). System admins additionally get the
   old "מחובר/ת כ:" dropdown, purely as a client-side impersonation view for
   testing/support — their real Firestore writes are still authenticated as
   themselves either way. */
let realtimeAttached = false;
function listenForAuthChanges(){
  const { onAuthStateChanged } = window.__fb.authMod;
  onAuthStateChanged(fbAuth, async (user)=>{
    state.authUser = user;
    if(!user){
      state.realPersonId = null; state.currentUserId = null;
      renderAuthGate('signedOut');
      return;
    }
    await refreshRoster();
    const email = (user.email||'').trim().toLowerCase();
    const match = state.roster.find(p=>(p.email||'').trim().toLowerCase()===email);
    if(!match){
      state.realPersonId = null; state.currentUserId = null;
      renderAuthGate('notRegistered', user.email);
      return;
    }
    state.realPersonId = match.id;
    state.currentUserId = match.id;
    await refreshEnvelopes();
    resetDraft();
    const allowed = getAllowedTabs();
    state.tab = defaultTabForUser(getCurrentUser());
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
    hideAuthGate();
    renderNavTabs();
    renderIdentitySwitcher();
    render();
    if(!realtimeAttached){ attachRealtimeListeners(); realtimeAttached = true; }
  });
}

function hideAuthGate(){
  const gate = document.getElementById('authGate');
  if(gate) gate.style.display = 'none';
}
function renderBackendBadge(){
  const el = document.getElementById('backendBadge');
  if(!el) return;
  if(usingCloudBackend){
    el.className = 'status-pill status-ok';
    el.textContent = '🟢 פעיל';
    el.title = 'מחובר למערכת — נתונים משותפים בזמן אמת';
  } else {
    el.className = 'status-pill status-bad';
    el.textContent = '🔴 לא פעיל';
    el.title = 'יש תקלה בחיבור למערכת — לא ניתן להעלות מסמכים כרגע';
  }
}
function attachRealtimeListeners(){
  try{
    const { collection, onSnapshot } = window.__fb.firestoreMod;
    onSnapshot(collection(fbDb,'envelopes'), async ()=>{
      await refreshEnvelopes();
      renderNavTabs();
      if(state.tab==='dashboard') render();
    });
    onSnapshot(collection(fbDb,'roster'), async ()=>{
      await refreshRoster();
      if(state.realPersonId && !state.roster.find(p=>p.id===state.realPersonId)){
        // המנהל הסיר את המשתמש הזה מהרשימה בזמן שהוא היה מחובר — חוסמים מחדש
        state.realPersonId = null; state.currentUserId = null;
        renderAuthGate('notRegistered', state.authUser && state.authUser.email);
        return;
      }
      renderIdentitySwitcher();
      if(state.tab==='admin') renderAdminPage();
      if(state.tab==='upload') renderUploadPage();
    });
  }catch(err){ console.error('[signflow] realtime listener setup failed', err); }
}
async function refreshEnvelopes(){
  const ids = await StorageAPI.listEnvelopeIds();
  const list = [];
  for(const id of ids){ const e = await StorageAPI.getEnvelope(id); if(e) list.push(e); }
  list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  state.envelopes = list;
}
async function refreshRoster(){ state.roster = await StorageAPI.getRoster(); }

/* ---------------- permissions (demo identity simulation) ---------------- */
function getCurrentUser(){
  if(!state.currentUserId) return null;
  return state.roster.find(p=>p.id===state.currentUserId) || null;
}
function getAllowedTabs(){
  const u = getCurrentUser();
  if(!u) return ['upload','dashboard','admin'];           // no identity selected → unrestricted bootstrap/admin mode
  if(u.role==='admin') return ['upload','dashboard','admin'];
  if(u.role==='sender') return ['upload'];
  if(u.role==='signer') return ['dashboard','upload'];
  return ['upload','dashboard','admin'];
}
function defaultTabForUser(u){
  if(!u) return 'upload';
  if(u.role==='signer') return 'dashboard';
  if(u.role==='sender') return 'upload';
  return 'upload'; // admin
}
const TAB_LABELS = { upload:'העלאה', dashboard:'מסמכים', admin:'ניהול' };
function pendingSignCount(){
  const cu = getCurrentUser();
  if(!cu) return 0;
  return state.envelopes.filter(env =>
    !['Completed','Voided','Declined'].includes(env.status) &&
    env.signers.some(s=>s.id===cu.id && s.status==='active')
  ).length;
}
function renderNavTabs(){
  const nav = document.getElementById('navTabs');
  if(!nav) return;
  const allowed = getAllowedTabs();
  const pending = pendingSignCount();
  nav.innerHTML = allowed.map(t=>{
    const badge = (t==='dashboard' && pending>0) ? `<span class="nav-badge">${pending}</span>` : '';
    return `<button data-tab="${t}" class="${state.tab===t?'active':''}">${TAB_LABELS[t]}${badge}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
}
function renderIdentitySwitcher(){
  const wrap = document.getElementById('identitySwitcher');
  if(!wrap) return;
  if(usingCloudBackend){
    const real = state.roster.find(p=>p.id===state.realPersonId);
    let html = `<span class="id-label">מחובר/ת: ${real?escapeHtml(real.name)+' ('+ROLE_LABEL[real.role]+')':'—'}</span>`;
    if(real && real.role==='admin'){
      const options = [`<option value="">🔓 עצמי (${escapeHtml(real.name)})</option>`]
        .concat(state.roster.filter(p=>p.id!==real.id).map(p=>`<option value="${p.id}" ${state.currentUserId===p.id?'selected':''}>הצג כ: ${escapeHtml(p.name)} — ${ROLE_LABEL[p.role]}</option>`));
      html += `<select id="identity-select">${options.join('')}</select>`;
    }
    html += `<button class="btn btn-ghost btn-sm" id="btn-signout" style="margin-inline-start:8px;">התנתקות</button>`;
    wrap.innerHTML = html;
    const sel = document.getElementById('identity-select');
    if(sel){
      sel.value = (state.currentUserId!==state.realPersonId) ? state.currentUserId : '';
      sel.addEventListener('change', async (e)=>{
        state.currentUserId = e.target.value || state.realPersonId;
        const allowed = getAllowedTabs();
        state.tab = defaultTabForUser(getCurrentUser());
        if(!allowed.includes(state.tab)) state.tab = allowed[0];
        state.currentEnvId = null;
        renderNavTabs();
        render();
        toast('מציג כעת כ: ' + escapeHtml(getCurrentUser() ? getCurrentUser().name : real.name));
      });
    }
    document.getElementById('btn-signout').addEventListener('click', signOutUser);
    return;
  }
  // local fallback (no Firebase) — original demo identity-simulation switcher, unchanged
  const options = [`<option value="">🔓 מצב מנהל (לא מזוהה)</option>`]
    .concat(state.roster.map(p=>`<option value="${p.id}" ${state.currentUserId===p.id?'selected':''}>${escapeHtml(p.name)} — ${ROLE_LABEL[p.role]}</option>`));
  wrap.innerHTML = `<span class="id-label">מחובר/ת כ:</span><select id="identity-select">${options.join('')}</select>`;
  document.getElementById('identity-select').value = state.currentUserId || '';
  document.getElementById('identity-select').addEventListener('change', async (e)=>{
    state.currentUserId = e.target.value || null;
    await StorageAPI.setCurrentUserId(state.currentUserId);
    const allowed = getAllowedTabs();
    state.tab = defaultTabForUser(getCurrentUser());
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
    state.currentEnvId = null;
    renderNavTabs();
    render();
    toast('זהות עודכנה — כעת מחובר/ת כ' + (getCurrentUser() ? escapeHtml(getCurrentUser().name) : 'מנהל (לא מזוהה)'));
  });
}

function switchTab(tab){
  if(!getAllowedTabs().includes(tab)) return; // no permission to view this interface
  state.tab = tab;
  renderNavTabs();
  if(tab==='dashboard') state.currentEnvId = null;
  if(tab==='upload' && !state.draft) resetDraft();
  render();
}
async function refreshPermissionsUI(){
  if(state.currentUserId && !state.roster.find(p=>p.id===state.currentUserId)){
    if(usingCloudBackend){
      state.currentUserId = state.roster.find(p=>p.id===state.realPersonId) ? state.realPersonId : null;
    } else {
      state.currentUserId = null;
      await StorageAPI.setCurrentUserId(null);
    }
  }
  const allowed = getAllowedTabs();
  if(!allowed.includes(state.tab)){
    state.tab = defaultTabForUser(getCurrentUser());
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
  }
  renderNavTabs();
  renderIdentitySwitcher();
}

function resetDraft(){
  state.draft = { id: uid(), title:'', flowType:'parallel', documentName:'', documentBase64:'', documentSizeBytes:0, pageCount:0, signerIds:[], fields:[] };
  state.currentPage = 1; state.fieldsEnabled = false; state.placingSignerId = null;
}

function render(){
  if(state.tab==='upload') return renderUploadPage();
  if(state.tab==='admin') return renderAdminPage();
  return renderDashboard();
}

/* ================= UPLOAD PAGE (single unified flow) ================= */
function renderUploadPage(){
  const d = state.draft;
  let html = `<div class="page-title">העלאת מסמכים</div>
  <div class="page-sub">העלו מסמך, בחרו את מי שצריך לחתום עליו, ובמידת הצורך מקמו את מיקום שדה החתימה על גבי המסמך.</div>`;

  html += `<div class="card card-pad section-block">
    <div class="section-heading"><span class="section-num">1</span> העלאת מסמך</div>
    ${d.documentName ? `
      <div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
        <div>📄 <b>${escapeHtml(d.documentName)}</b> — ${d.pageCount} עמודים · ${(d.documentSizeBytes/1024).toFixed(0)}KB</div>
        <button class="btn btn-ghost btn-sm" id="btn-replace-doc">החלף קובץ</button>
      </div>
      ${usingCloudBackend && d.documentSizeBytes > FIRESTORE_SAFE_PDF_BYTES*0.75 ? `
      <div class="hint" style="background:var(--amber-soft);border:1px solid #E4CE9C;color:#5C4318;border-radius:8px;padding:10px 12px;margin-top:8px;">
        ⚠️ הקובץ קרוב למגבלת האחסון (${(d.documentSizeBytes/1024).toFixed(0)}KB מתוך ${(FIRESTORE_SAFE_PDF_BYTES/1024).toFixed(0)}KB). לאחר הטמעת החתימות הקובץ יגדל מעט — מומלץ לדחוס את ה-PDF מראש אם אפשר.
      </div>` : ''}` : `
      <div class="dropzone" id="dropzone" style="${!usingCloudBackend?'opacity:.5;cursor:not-allowed;':''}">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0-11 4 4m-4-4-4 4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="#16232B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-weight:600;">${usingCloudBackend?'גררו קובץ PDF לכאן או לחצו לבחירה':'לא ניתן להעלות מסמכים כרגע — יש תקלה באפליקציה'}</div>
        <div class="hint">קובץ PDF בלבד, עד 20MB</div>
      </div>`}
    <input type="file" id="f-file" accept="application/pdf" style="display:none">
    ${d.documentName ? `<div class="field-group" style="margin-top:16px;"><label class="field-label">כותרת המסמך</label><input type="text" id="f-title" value="${escapeHtml(d.title)}" placeholder='לדוגמה: "הסכם התקשרות — ספק 2026"'></div>` : ''}
  </div>`;

  const sectionsEnabled = !!d.documentBase64;
  html += `<div class="card card-pad section-block ${sectionsEnabled?'':'disabled-block'}">
    <div class="section-heading"><span class="section-num">2</span> מי צריך לחתום?</div>
    ${state.roster.length===0 ? `
      <div class="hint">לא הוגדרו חותמים במערכת עדיין. <button class="btn btn-ghost btn-sm" id="btn-goto-admin">מעבר לניהול משתמשים →</button></div>
    ` : `
    <div class="field-group">
      <label class="field-label">בחרו חותמים מתוך רשימת המשתמשים המורשים</label>
      ${state.roster.map(p=>{
        const sel = d.signerIds.includes(p.id);
        const orderIdx = d.signerIds.indexOf(p.id);
        return `<div class="signer-check-row ${sel?'sel':''}" data-toggle-signer="${p.id}">
          ${d.flowType==='sequential' && sel ? `<div class="signer-order">${orderIdx+1}</div>` : `<input type="checkbox" ${sel?'checked':''} style="width:18px;height:18px;pointer-events:none;">`}
          <div class="signer-info"><div class="nm">${escapeHtml(p.name)}</div><div class="em">${escapeHtml(p.email)} · <span class="badge ${ROLE_CLASS[p.role]}" style="padding:2px 8px;font-size:10.5px;">${ROLE_LABEL[p.role]}</span></div></div>
          ${d.flowType==='sequential' && sel ? `
            <button class="icon-btn" data-move-signer="-1" data-id="${p.id}" title="הזז למעלה">↑</button>
            <button class="icon-btn" data-move-signer="1" data-id="${p.id}" title="הזז למטה">↓</button>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="field-group" style="max-width:320px;">
      <label class="field-label">סדר חתימה</label>
      <select id="f-flow">
        <option value="parallel" ${d.flowType==='parallel'?'selected':''}>מקבילה — כולם חותמים יחד (ברירת מחדל)</option>
        <option value="sequential" ${d.flowType==='sequential'?'selected':''}>טורית — לפי סדר</option>
      </select>
    </div>
    `}
  </div>`;

  const signersChosen = d.signerIds.length>0;
  html += `<div class="card card-pad section-block ${sectionsEnabled && signersChosen ? '' : 'disabled-block'}">
    <div class="toggle-row" id="toggle-fields-row">
      <div class="section-heading" style="margin-bottom:0;"><span class="section-num">3</span> מיקום שדה חתימה על המסמך <span style="font-weight:400;font-size:13px;color:var(--gray);margin-right:8px;">(אופציונלי — ברירת המחדל: שדה חתימה)</span></div>
      <div class="switch ${state.fieldsEnabled?'on':''}" id="fieldsSwitch"></div>
    </div>
    ${!state.fieldsEnabled ? `<div class="hint" style="margin-top:8px;">אם תשאירו את זה כבוי (ברירת המחדל), כל חותם ייכנס למסמך בעצמו וילחץ במקום שבו הוא רוצה לחתום — אין צורך לקבוע זאת מראש. הפעילו את המתג רק אם אתם רוצים לקבוע בעצמכם איפה בדיוק כל אחד חותם.</div>` : renderFieldEditorSection(d)}
  </div>`;

  const canSend = sectionsEnabled && signersChosen && d.title.trim();
  html += `<div class="card card-pad section-block">
    <button class="btn btn-seal" id="btn-send-envelope" style="width:100%;justify-content:center;" ${canSend?'':'disabled'}>🖋 שלח מסמך לחתימה</button>
    ${!canSend ? `<div class="hint" style="text-align:center;margin-top:8px;">נדרש: העלאת מסמך, כותרת, ולפחות חותם אחד.</div>` : ''}
  </div>`;

  app.innerHTML = html;
  bindUploadEvents();
  if(state.fieldsEnabled) renderPdfIntoEditor();
}

function renderFieldEditorSection(d){
  const fieldsOnPage = d.fields.filter(f=>f.page===state.currentPage);
  let signerOptions = d.signerIds.map(id=>{ const p=state.roster.find(r=>r.id===id); return p ? `<option value="${p.id}">${escapeHtml(p.name)}</option>` : ''; }).join('');
  let fieldList = d.fields.map((f,i)=>{
    const p = state.roster.find(r=>r.id===f.fieldSignerId) || {};
    return `<div class="field-list-item"><span class="sw"></span><span style="flex:1;">חתימה · עמ' ${f.page} · ${escapeHtml(p.name||'?')}</span><button class="icon-btn" data-del-field="${i}">✕</button></div>`;
  }).join('') || `<div class="hint">לא נוספו שדות ידניים — יוגדר שדה חתימה אוטומטי לכל חותם.</div>`;

  return `
  <div class="editor-shell" style="margin-top:16px;">
    <div>
      <div class="pdf-toolbar">
        <div class="page-nav">
          <button class="btn btn-ghost btn-sm" id="btn-prev-page">‹ הקודם</button>
          <span>עמוד ${state.currentPage} מתוך ${d.pageCount}</span>
          <button class="btn btn-ghost btn-sm" id="btn-next-page">הבא ›</button>
        </div>
        <div class="hint">${state.placingSignerId ? 'לחצו על המסמך למיקום שדה החתימה' : 'בחרו חותם, לחצו "הוסף שדה חתימה", ואז לחצו על המסמך'}</div>
      </div>
      <div class="pdf-stage">
        <div class="pdf-page-wrap" id="pdfPageWrap">
          <canvas id="pdfCanvas"></canvas>
          ${fieldsOnPage.map((f)=>{
            const gi = d.fields.indexOf(f);
            const p = state.roster.find(r=>r.id===f.fieldSignerId) || {};
            return `<div class="field-box" style="left:${f.xPct*100}%;top:${f.yPct*100}%;width:${f.wPct*100}%;height:${f.hPct*100}%;">
              <span class="del" data-del-field="${gi}">✕</span>✍️ ${escapeHtml((p.name||'').split(' ')[0]||'')}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div>
      <div class="card card-pad" style="margin-bottom:16px;">
        <label class="field-label">שייך לחותם</label>
        <select id="f-field-signer-select">${signerOptions}</select>
        <button class="btn ${state.placingSignerId ? 'btn-seal':'btn-ghost'} btn-sm" id="btn-start-place" style="width:100%;justify-content:center;margin-top:10px;">${state.placingSignerId ? 'לחצו על המסמך…' : '+ הוסף שדה חתימה'}</button>
      </div>
      <div class="card card-pad"><h3 style="font-size:14px;">שדות שהוגדרו (${d.fields.length})</h3>${fieldList}</div>
    </div>
  </div>`;
}

function bindUploadEvents(){
  const d = state.draft;
  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('f-file');
  dz?.addEventListener('click', ()=>{ if(!usingCloudBackend){ showAppMalfunction(); return; } fileInput.click(); });
  dz?.addEventListener('dragover', e=>{e.preventDefault(); if(usingCloudBackend) dz.classList.add('drag');});
  dz?.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz?.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(!usingCloudBackend){ showAppMalfunction(); return; } if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  document.getElementById('btn-replace-doc')?.addEventListener('click', ()=>{ if(!usingCloudBackend){ showAppMalfunction(); return; } fileInput.click(); });
  fileInput?.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
  document.getElementById('f-title')?.addEventListener('input', e=>{ d.title=e.target.value; syncSendBtn(); });
  document.getElementById('btn-goto-admin')?.addEventListener('click', ()=>switchTab('admin'));

  document.getElementById('f-flow')?.addEventListener('change', e=>{ d.flowType=e.target.value; renderUploadPage(); });
  document.querySelectorAll('[data-toggle-signer]').forEach(row=>row.addEventListener('click', ()=>{
    const id = row.dataset.toggleSigner;
    const idx = d.signerIds.indexOf(id);
    if(idx>=0){ d.signerIds.splice(idx,1); d.fields = d.fields.filter(f=>f.fieldSignerId!==id); }
    else d.signerIds.push(id);
    renderUploadPage();
  }));
  document.querySelectorAll('[data-move-signer]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id=b.dataset.id, dir=+b.dataset.moveSigner;
    const idx=d.signerIds.indexOf(id), j=idx+dir;
    if(j<0||j>=d.signerIds.length) return;
    [d.signerIds[idx],d.signerIds[j]]=[d.signerIds[j],d.signerIds[idx]];
    renderUploadPage();
  }));

  document.getElementById('toggle-fields-row')?.addEventListener('click', (e)=>{
    if(e.target.closest('[data-toggle-signer]')) return;
    state.fieldsEnabled = !state.fieldsEnabled;
    state.placingSignerId = null;
    renderUploadPage();
  });

  document.getElementById('btn-prev-page')?.addEventListener('click', (e)=>{ e.stopPropagation(); if(state.currentPage>1){ state.currentPage--; renderUploadPage(); } });
  document.getElementById('btn-next-page')?.addEventListener('click', (e)=>{ e.stopPropagation(); if(state.currentPage<d.pageCount){ state.currentPage++; renderUploadPage(); } });
  document.getElementById('btn-start-place')?.addEventListener('click', (e)=>{
    e.stopPropagation();
    const signerId = document.getElementById('f-field-signer-select')?.value;
    if(!signerId){ toast('בחרו חותם'); return; }
    state.placingSignerId = state.placingSignerId ? null : signerId;
    renderUploadPage();
  });
  document.querySelectorAll('[data-del-field]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    d.fields.splice(+b.dataset.delField,1);
    renderUploadPage();
  }));
  const pageWrap = document.getElementById('pdfPageWrap');
  pageWrap?.addEventListener('click', (e)=>{
    if(!state.placingSignerId) return;
    if(e.target.closest('.field-box')) return;
    const rect = pageWrap.getBoundingClientRect();
    const xPct = (e.clientX-rect.left)/rect.width, yPct = (e.clientY-rect.top)/rect.height;
    const wPct=0.22, hPct=0.06;
    d.fields.push({ id:uid(), fieldSignerId: state.placingSignerId, page: state.currentPage,
      xPct: Math.max(0,Math.min(1-wPct,xPct-wPct/2)), yPct: Math.max(0,Math.min(1-hPct,yPct-hPct/2)),
      wPct, hPct, signatureDataUrl:'', filledAt:null });
    state.placingSignerId = null;
    renderUploadPage();
  });

  document.getElementById('btn-send-envelope')?.addEventListener('click', sendEnvelope);
  syncSendBtn();
  bindFieldDrag(pageWrap, d);
}
// גרירת שדה חתימה שכבר מוקם, לשינוי מיקומו (בעכבר ובמגע כאחד)
function bindFieldDrag(pageWrap, d){
  if(!pageWrap) return;
  pageWrap.querySelectorAll('.field-box').forEach(box=>{
    const gi = +box.querySelector('.del')?.dataset.delField;
    if(Number.isNaN(gi)) return;
    box.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('.del')) return; // הלחיצה על ה-✕ מוחקת, לא גוררת
      e.preventDefault(); e.stopPropagation();
      const f = d.fields[gi];
      const rect = pageWrap.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY;
      const startXPct = f.xPct, startYPct = f.yPct;
      box.setPointerCapture(e.pointerId);
      box.classList.add('dragging');
      const onMove = (ev)=>{
        const dxPct = (ev.clientX-startX)/rect.width;
        const dyPct = (ev.clientY-startY)/rect.height;
        f.xPct = Math.max(0, Math.min(1-f.wPct, startXPct+dxPct));
        f.yPct = Math.max(0, Math.min(1-f.hPct, startYPct+dyPct));
        box.style.left = (f.xPct*100)+'%';
        box.style.top = (f.yPct*100)+'%';
      };
      const onUp = (ev)=>{
        box.removeEventListener('pointermove', onMove);
        box.removeEventListener('pointerup', onUp);
        box.removeEventListener('pointercancel', onUp);
        box.classList.remove('dragging');
      };
      box.addEventListener('pointermove', onMove);
      box.addEventListener('pointerup', onUp);
      box.addEventListener('pointercancel', onUp);
    });
  });
}
function syncSendBtn(){
  const d = state.draft;
  const btn = document.getElementById('btn-send-envelope');
  if(btn) btn.disabled = !(d.documentBase64 && d.title.trim() && d.signerIds.length>0);
}

async function handleFile(file){
  if(!usingCloudBackend){ showAppMalfunction(); const fi=document.getElementById('f-file'); if(fi) fi.value=''; return; }
  const nameLower = (file.name||'').toLowerCase();
  const looksLikePdfExt = nameLower.endsWith('.pdf');
  const looksLikePdfType = file.type === 'application/pdf';
  if(!looksLikePdfExt || (file.type && !looksLikePdfType)){
    toastError('יש להעלות קבצים בפורמט PDF בלבד. הקובץ שנבחר (' + (file.name||'ללא שם') + ') אינו PDF.');
    const fi = document.getElementById('f-file'); if(fi) fi.value = '';
    return;
  }
  if(file.size > 20*1024*1024){ toastError('הקובץ גדול מדי (מקסימום 20MB)'); return; }
  if(usingCloudBackend && file.size > FIRESTORE_SAFE_PDF_BYTES){
    toastError(`המסמך (${(file.size/1024).toFixed(0)}KB) גדול מדי לאחסון ב-Firestore (מגבלה ~${(FIRESTORE_SAFE_PDF_BYTES/1024).toFixed(0)}KB בתצורה הנוכחית, ללא Firebase Storage). נסו לדחוס את ה-PDF או להשתמש בקובץ קטן יותר.`);
    return;
  }
  const buf = await file.arrayBuffer();
  const base64 = bufToBase64(buf);
  try{
    const pdf = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
    state.draft.documentName = file.name;
    state.draft.documentBase64 = base64;
    state.draft.documentSizeBytes = file.size;
    state.draft.pageCount = pdf.numPages;
    if(!state.draft.title) state.draft.title = file.name.replace(/\.pdf$/i,'');
    toast('המסמך נטען בהצלחה — ' + pdf.numPages + ' עמודים');
    renderUploadPage();
  }catch(err){ console.error(err); toastError('שגיאה בקריאת קובץ ה-PDF — ייתכן שהקובץ פגום או אינו PDF תקין.'); }
}

let editorRenderToken = 0;
/* מטמון PDF משותף — טעינה ופרסור של PDF (pdf.js) איטיים יחסית; בלי מטמון, כל רינדור מחדש
   (שקורה כמעט בכל לחיצה) היה טוען ומפענח את כל הקובץ מחדש מאפס, כולל כשכמה תצוגות מקדימות
   (למשל כמה שדות חתימה) נטענות באותו מסך — כל אחת בנפרד. שמירה לפי הפניה למחרוזת ה-base64
   (לא ערכה) מספיקה, כי אותו אובייקט מחרוזת נשאר בזיכרון כל עוד לא הוחלף קובץ. */
let sharedPdfCache = { base64: null, promise: null };
function getSharedPdf(base64){
  if(sharedPdfCache.base64 === base64 && sharedPdfCache.promise) return sharedPdfCache.promise;
  const buf = base64ToBuf(base64);
  const p = pdfjsLib.getDocument({data: buf}).promise;
  sharedPdfCache = { base64, promise: p };
  return p;
}

let editorRenderTask = null;
async function renderPdfIntoEditor(){
  const d = state.draft;
  if(!d.documentBase64) return;
  const canvas = document.getElementById('pdfCanvas');
  if(!canvas) return;
  const myToken = ++editorRenderToken; // invalidates any still-pending older render below
  if(editorRenderTask){ try{ editorRenderTask.cancel(); }catch(e){} }
  try{
    const pdf = await getSharedPdf(d.documentBase64);
    const page = await pdf.getPage(state.currentPage);
    if(myToken !== editorRenderToken) return; // a newer render started while we were loading — bail out
    const viewport = page.getViewport({scale:1});
    const stageEl = document.querySelector('.pdf-stage');
    const availW = stageEl ? Math.max(200, stageEl.clientWidth - 40) : 640; // 40px = stage padding
    const scale = Math.min(640, availW)/viewport.width;
    const sv = page.getViewport({scale});
    canvas.width = sv.width; canvas.height = sv.height;
    editorRenderTask = page.render({canvasContext:canvas.getContext('2d'), viewport:sv});
    await editorRenderTask.promise;
    editorRenderTask = null;
  }catch(err){
    if(err && err.name==='RenderingCancelledException') return;
    console.error(err);
  }
}

/* ================= SEND ================= */
async function sendEnvelope(){
  if(!usingCloudBackend){ showAppMalfunction(); return; }
  const d = state.draft;
  const signers = d.signerIds.map(id=>{
    const p = state.roster.find(r=>r.id===id);
    return { id: p.id, name:p.name, email:p.email, phone:p.phone||'', internal:p.internal!==false, status:'pending', signedAt:null, declinedAt:null, declineReason:'', activatedAt:null, reminderSent:false };
  });
  // Fields only exist here if the sender manually placed them (section 3 toggle).
  // Signers with no pre-placed field will choose their own signing location when they open the document.
  const fields = d.fields.slice();

  const creator = getCurrentUser();
  const env = {
    id: d.id, title: d.title, flowType: d.flowType,
    documentName: d.documentName, documentBase64: d.documentBase64, pageCount: d.pageCount,
    signers, fields, status:'Sent', createdAt: nowISO(), sentAt: nowISO(), completedAt:null,
    finalPdfBase64:'', finalHash:'', auditLog:[],
    createdById: creator ? creator.id : null, createdByName: creator ? creator.name : 'לא ידוע',
  };
  env.originalHash = await sha256(base64ToBuf(env.documentBase64));
  addAudit(env, 'system', `המסמך "${env.title}" נוצר ונשלח לחתימה (${env.flowType==='sequential'?'טורית':'מקבילה'})`);
  if(env.flowType==='sequential'){ if(env.signers[0]){ env.signers[0].status='active'; env.signers[0].activatedAt=nowISO(); } }
  else { const ts=nowISO(); env.signers.forEach(s=>{ s.status='active'; s.activatedAt=ts; }); }

  try{
    await StorageAPI.saveEnvelope(env);
  }catch(err){
    console.error('[signflow] sendEnvelope failed', err);
    toastError('שליחת המסמך נכשלה — ייתכן שהקובץ גדול מדי לאחסון ב-Firestore. פרטים בקונסולת הדפדפן.');
    return;
  }
  await refreshEnvelopes();
  toast('המסמך נשלח בהצלחה 🎉');
  // התראת "הגיע תורך לחתום": בזרימה טורית — רק לחותם הראשון; בזרימה מקבילה — לכולם מיד, כי כולם פעילים מהרגע הראשון
  if(env.flowType==='sequential'){ if(env.signers[0]) notifySignerTurn(env, env.signers[0]); }
  else { env.signers.forEach(s=>notifySignerTurn(env, s)); }
  resetDraft();
  state.currentEnvId = env.id;
  switchTab('dashboard');
}
function addAudit(env, actor, action){
  let finalAction = action;
  if(usingCloudBackend && state.realPersonId && state.currentUserId && state.currentUserId!==state.realPersonId){
    const real = state.roster.find(p=>p.id===state.realPersonId);
    if(real) finalAction += ` [בוצע בפועל על ידי מנהל המערכת ${real.name}, במצב "הצג כ-${actor}"]`;
  }
  env.auditLog.push({ ts: nowISO(), actor, action: finalAction });
}

function renderAdminPage(){
  adminSigDraft = state.editingPersonId ? ((state.roster.find(r=>r.id===state.editingPersonId)||{}).signatureImage || '') : '';
  let html = `<div class="page-title">ניהול משתמשים והרשאות</div>

  // ---- Excel import card ----
  html += `<div class="card card-pad section-block">

    </div>

  </div>`;

    const includedCount = state.importPreview.filter(r=>r.include).length;
    html += `<div class="card card-pad section-block">

        <tr class="import-row ${r.isDuplicate?'dup':''} ${r.include?'':'excluded'}">

          <td>${r.name ? escapeHtml(r.name) : '<span style="color:var(--seal);">חסר שם</span>'}</td>
          <td>${r.email ? escapeHtml(r.email) : '<span style="color:var(--seal);">חסר אימייל</span>'}</td>
          <td>${escapeHtml(r.phone||'—')}</td>
          <td><select data-import-role="${i}">
            <option value="admin" ${r.role==='admin'?'selected':''}>מנהל מערכת</option>
            <option value="sender" ${r.role==='sender'?'selected':''}>שולח מסמכים</option>
            <option value="signer" ${r.role==='signer'?'selected':''}>חותם</option>
          </select></td>
          <td>${r.isDuplicate ? '<span class="tag-update">יעודכן</span>' : '<span class="tag-new">חדש</span>'}</td>
        </tr>`).join('')}</tbody></table>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn btn-primary" id="btn-confirm-import" style="flex:1;justify-content:center;" ${includedCount===0?'disabled':''}>✓ ייבוא ${includedCount} משתמשים</button>
        <button class="btn btn-ghost" id="btn-cancel-import">ביטול</button>
      </div>
    </div>`;
  }

  // ---- manual add + roster table ----
  html += `<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:22px;">
    <div class="card card-pad">
      <h3 style="font-size:16px;">${state.editingPersonId ? 'עריכת משתמש' : 'הוספת משתמש ידנית'}</h3>
      <div class="field-group"><label class="field-label">שם מלא</label><input type="text" id="p-name" placeholder="ישראל ישראלי"></div>
      <div class="field-group"><label class="field-label">אימייל (חייב להיות זהה לחשבון ה-Google שאיתו החותם יתחבר)</label><input type="email" id="p-email" placeholder="name@example.com"></div>
      <div class="field-group"><label class="field-label">טלפון</label><input type="tel" id="p-phone" placeholder="05X-XXXXXXX"></div>
      <div class="field-group"><label class="field-label">רמת הרשאה</label>
        <select id="p-role">
          <option value="admin">מנהל מערכת — ניהול משתמשים ומסמכים</option>
          <option value="sender" selected>שולח מסמכים — יצירת מסמכים</option>
          <option value="signer">חותם — יכול לחתום, וגם להעלות מסמכים כמשתמש רגיל</option>
        </select>
      </div>
      <div class="field-group"><label class="field-label">סוג</label>
        <select id="p-internal"><option value="1">פנימי (עובד הארגון)</option><option value="0">חיצוני</option></select>
      </div>
      <div class="field-group">
        <label class="field-label">קובץ חתימה (PNG) — אופציונלי, לשיבוץ אוטומטי בעת חתימה</label>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div id="sig-preview-wrap">${adminSigDraft ? `<img id="sig-preview-img" src="${adminSigDraft}" style="height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;"><button type="button" class="btn btn-ghost btn-sm" id="btn-remove-sig">הסר</button>` : `<span class="hint">לא הועלתה חתימה</span>`}</div>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-upload-sig">העלאת PNG</button>
        </div>
        <input type="file" id="p-signature-file" accept="image/png" style="display:none">
        <div class="hint">קובץ PNG עם רקע שקוף נותן את התוצאה הכי נקייה על גבי המסמך.</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" id="btn-save-person" style="flex:1;justify-content:center;">${state.editingPersonId ? 'שמור שינויים' : '+ הוסף משתמש'}</button>
        ${state.editingPersonId ? `<button class="btn btn-ghost" id="btn-cancel-edit">ביטול</button>` : ''}
      </div>
    </div>
    <div class="card card-pad">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;">
        <h3 style="font-size:16px;margin:0;">רשימת משתמשים (${state.roster.length})</h3>
        <button class="btn btn-ghost btn-sm" id="btn-export-roster" ${state.roster.length===0?'disabled':''}>⬇ ייצוא לאקסל</button>
      </div>
      ${state.roster.length===0 ? `<div class="hint">טרם נוספו משתמשים.</div>` : `
      <table class="roster-table"><thead><tr><th>שם</th><th>אימייל</th><th>הרשאה</th><th>סוג</th><th>חתימה</th><th></th></tr></thead>
      <tbody>${state.roster.map(p=>`
        <tr>
          <td><b>${escapeHtml(p.name)}</b></td>
          <td>${escapeHtml(p.email)}</td>
          <td><span class="badge ${ROLE_CLASS[p.role]}">${ROLE_LABEL[p.role]}</span></td>
          <td>${p.internal!==false?'פנימי':'חיצוני'}</td>
          <td>${p.signatureImage ? `<img src="${p.signatureImage}" style="height:24px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:2px;">` : `<span class="hint">—</span>`}</td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" data-edit-person="${p.id}" title="עריכה">✎</button>
            <button class="icon-btn" data-del-person="${p.id}" title="מחיקה">✕</button>
          </td>
        </tr>`).join('')}</tbody></table>`}
    </div>
  </div>
  <div class="card card-pad section-block">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <div><h3 style="font-size:16px;margin:0 0 2px;">📊 דוח מצב מסמכים</h3><div class="hint">ייצוא Excel של כל המסמכים במערכת — מי חתם, מי לא, ומתי.</div></div>
      <button class="btn btn-ghost btn-sm" id="btn-export-docs-report" ${state.envelopes.length===0?'disabled':''}>⬇ ייצוא דוח לאקסל</button>
    </div>
  </div>`;
  app.innerHTML = html;

  if(state.editingPersonId){
    const p = state.roster.find(r=>r.id===state.editingPersonId);
    if(p){
      document.getElementById('p-name').value = p.name;
      document.getElementById('p-email').value = p.email;
      document.getElementById('p-phone').value = p.phone||'';
      document.getElementById('p-role').value = p.role;
      document.getElementById('p-internal').value = p.internal!==false ? '1':'0';
    }
  }

  document.getElementById('btn-save-person').addEventListener('click', savePerson);
  document.getElementById('btn-cancel-edit')?.addEventListener('click', ()=>{ state.editingPersonId=null; renderAdminPage(); });
  document.querySelectorAll('[data-edit-person]').forEach(b=>b.addEventListener('click', ()=>{ state.editingPersonId=b.dataset.editPerson; renderAdminPage(); }));
  document.querySelectorAll('[data-del-person]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('להסיר את המשתמש מהרשימה?')) return;
    const delId = b.dataset.delPerson;
    state.roster = state.roster.filter(p=>p.id!==delId);
    await StorageAPI.deletePerson(delId);
    await refreshPermissionsUI();
    render();
  }));

  // ---- import bindings ----
  document.getElementById('btn-download-template')?.addEventListener('click', downloadRosterTemplate);
  document.getElementById('btn-export-roster')?.addEventListener('click', exportRosterToExcel);
  document.getElementById('btn-export-docs-report')?.addEventListener('click', exportDocumentsReportToExcel);
  const idz = document.getElementById('importDropzone');
  const ifile = document.getElementById('f-import-file');
  idz?.addEventListener('click', ()=>ifile.click());
  idz?.addEventListener('dragover', e=>{ e.preventDefault(); idz.classList.add('drag'); });
  idz?.addEventListener('dragleave', ()=>idz.classList.remove('drag'));
  idz?.addEventListener('drop', e=>{ e.preventDefault(); idz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleRosterImportFile(e.dataTransfer.files[0]); });
  ifile?.addEventListener('change', e=>{ if(e.target.files[0]) handleRosterImportFile(e.target.files[0]); });

  document.querySelectorAll('[data-import-toggle]').forEach(cb=>cb.addEventListener('change', ()=>{
    state.importPreview[+cb.dataset.importToggle].include = cb.checked; renderAdminPage();
  }));
  document.querySelectorAll('[data-import-role]').forEach(sel=>sel.addEventListener('change', ()=>{
    state.importPreview[+sel.dataset.importRole].role = sel.value;
  }));
  document.getElementById('btn-cancel-import')?.addEventListener('click', ()=>{ state.importPreview=null; renderAdminPage(); });
  document.getElementById('btn-confirm-import')?.addEventListener('click', confirmRosterImport);

  // ---- signature upload bindings ----
  const sigFile = document.getElementById('p-signature-file');
  document.getElementById('btn-upload-sig')?.addEventListener('click', ()=>sigFile.click());
  sigFile?.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.type !== 'image/png'){ toastError('יש להעלות קובץ PNG בלבד'); sigFile.value=''; return; }
    if(file.size > 2*1024*1024){ toastError('הקובץ גדול מדי (מקסימום 2MB)'); sigFile.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => { adminSigDraft = reader.result; updateSigPreview(); toast('החתימה נטענה — לחצו "שמור" כדי לשייך אותה למשתמש'); };
    reader.readAsDataURL(file);
  });
  document.getElementById('btn-remove-sig')?.addEventListener('click', ()=>{ adminSigDraft=''; updateSigPreview(); });
}

function updateSigPreview(){
  const wrap = document.getElementById('sig-preview-wrap');
  if(!wrap) return;
  wrap.innerHTML = adminSigDraft
    ? `<img id="sig-preview-img" src="${adminSigDraft}" style="height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;"><button type="button" class="btn btn-ghost btn-sm" id="btn-remove-sig">הסר</button>`
    : `<span class="hint">לא הועלתה חתימה</span>`;
  document.getElementById('btn-remove-sig')?.addEventListener('click', ()=>{ adminSigDraft=''; updateSigPreview(); });
}

async function savePerson(){
  const name = document.getElementById('p-name').value.trim();
  const email = document.getElementById('p-email').value.trim();
  const phone = document.getElementById('p-phone').value.trim();
  const role = document.getElementById('p-role').value;
  const internal = document.getElementById('p-internal').value==='1';
  const signatureImage = adminSigDraft || '';
  if(!name || !email){ toast('נא למלא שם ואימייל'); return; }
  let person;
  if(state.editingPersonId){
    person = state.roster.find(r=>r.id===state.editingPersonId);
    Object.assign(person, {name,email,phone,role,internal,signatureImage});
    state.editingPersonId = null;
  } else {
    person = { id:uid(), name, email, phone, role, internal, signatureImage };
    state.roster.push(person);
  }
  adminSigDraft = '';
  await StorageAPI.upsertPerson(person);
  await refreshPermissionsUI();
  toast('הרשימה עודכנה');
  render();
}

/* ---------------- Excel roster import ---------------- */
const HEADER_SYNONYMS = {
  name: ['שם','שם מלא','name','full name','fullname'],
  email: ['מייל','אימייל','דואר אלקטרוני','email','e-mail','mail'],
  phone: ['טלפון','נייד','טלפון נייד','phone','mobile','tel','cell'],
  role: ['הרשאה','רמת הרשאה','תפקיד','role','permission','permission level'],
  internal: ['סוג','פנימי/חיצוני','internal','type'],
};
function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/["'\.]/g,''); }
function matchField(headerKey){
  const norm = normalizeHeader(headerKey);
  for(const field in HEADER_SYNONYMS){
    if(HEADER_SYNONYMS[field].some(syn => normalizeHeader(syn)===norm)) return field;
  }
  return null;
}
function mapRoleValue(raw){
  const v = String(raw||'').trim().toLowerCase();
  if(!v) return 'signer';
  if(v.includes('מנהל') || v.includes('admin')) return 'admin';
  if(v.includes('שולח') || v.includes('sender')) return 'sender';
  if(v.includes('חותם') || v.includes('signer')) return 'signer';
  return 'signer';
}
function mapInternalValue(raw){
  const v = String(raw||'').trim().toLowerCase();
  if(v.includes('חיצ') || v.includes('external')) return false;
  return true;
}

async function handleRosterImportFile(file){
  if(file.size > 5*1024*1024){ toast('הקובץ גדול מדי (מקסימום 5MB)'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){ toast('לא נמצאו שורות בקובץ'); return; }

    // map header keys of the first row to our fields
    const sampleKeys = Object.keys(rows[0]);
    const fieldByHeader = {};
    sampleKeys.forEach(h=>{ const f = matchField(h); if(f) fieldByHeader[h]=f; });

    const existingEmails = new Set(state.roster.map(p=>p.email.trim().toLowerCase()));
    const preview = rows.map(row=>{
      const rec = {name:'', email:'', phone:'', roleRaw:'', internalRaw:''};
      Object.keys(row).forEach(h=>{
        const field = fieldByHeader[h];
        if(!field) return;
        const val = String(row[h]).trim();
        if(field==='name') rec.name = val;
        else if(field==='email') rec.email = val;
        else if(field==='phone') rec.phone = val;
        else if(field==='role') rec.roleRaw = val;
        else if(field==='internal') rec.internalRaw = val;
      });
      return {
        name: rec.name, email: rec.email, phone: rec.phone,
        role: mapRoleValue(rec.roleRaw), internal: mapInternalValue(rec.internalRaw),
        isDuplicate: rec.email ? existingEmails.has(rec.email.toLowerCase()) : false,
        include: !!(rec.name && rec.email),
      };
    }).filter(r => r.name || r.email); // drop fully empty rows

    if(!preview.length){ toast('לא זוהו שורות תקינות — ודאו שהעמודות נקראות שם/אימייל/טלפון/הרשאה'); return; }
    state.importPreview = preview;
    renderAdminPage();
    toast(`זוהו ${preview.length} שורות — סמנו למי לייבא ולחצו על ״ייבוא״`);
  }catch(err){
    console.error(err);
    toast('שגיאה בקריאת קובץ ה-Excel — ודאו שזהו קובץ xlsx/xls/csv תקין');
  }
}

async function confirmRosterImport(){
  const rows = (state.importPreview||[]).filter(r=>r.include && r.name && r.email);
  if(!rows.length){ toast('לא נבחרו שורות לייבוא'); return; }
  let added=0, updated=0;
  for(const r of rows){
    const existing = state.roster.find(p=>p.email.trim().toLowerCase()===r.email.trim().toLowerCase());
    let person;
    if(existing){ Object.assign(existing, {name:r.name, phone:r.phone, role:r.role, internal:r.internal}); person=existing; updated++; }
    else { person = { id:uid(), name:r.name, email:r.email, phone:r.phone, role:r.role, internal:r.internal, signatureImage:'' }; state.roster.push(person); added++; }
    await StorageAPI.upsertPerson(person);
  }
  state.importPreview = null;
  await refreshPermissionsUI();
  toast(`ייבוא הושלם: ${added} משתמשים חדשים, ${updated} עודכנו`);
  render();
}

function downloadRosterTemplate(){
  const wsData = [
    ['שם','אימייל','טלפון','רמת הרשאה'],
    ['ישראל ישראלי','israel@example.com','050-1234567','שולח מסמכים'],
    ['דנה כהן','dana@example.com','052-7654321','חותם'],
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:20},{wch:26},{wch:16},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'משתמשים');
  XLSX.writeFile(wb, 'תבנית-ייבוא-משתמשים.xlsx');
}

function exportRosterToExcel(){
  if(!state.roster.length){ toast('אין משתמשים לייצוא'); return; }
  const wsData = [['שם','אימייל','טלפון','רמת הרשאה','סוג']];
  state.roster.forEach(p=>{
    wsData.push([p.name, p.email, p.phone||'', ROLE_LABEL[p.role]||'חותם', p.internal!==false ? 'פנימי' : 'חיצוני']);
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:22},{wch:28},{wch:16},{wch:20},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'משתמשים');
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `רשימת-משתמשים-${dateStr}.xlsx`);
  toast(`יוצאו ${state.roster.length} משתמשים לקובץ Excel`);
}

function exportDocumentsReportToExcel(){
  if(!state.envelopes.length){ toast('אין מסמכים לייצוא'); return; }
  const wsData = [['כותרת מסמך','סטטוס','הועלה על ידי','נוצר','הושלם','זרימה','סה"כ חותמים','חתמו','שם חותם','אימייל חותם','סטטוס חתימה','נחתם בפועל']];
  state.envelopes.forEach(env=>{
    const signedCount = env.signers.filter(s=>s.status==='signed').length;
    env.signers.forEach((s,i)=>{
      const signerStatusText = s.status==='signed' ? 'נחתם' : s.status==='declined' ? 'נדחה' : s.status==='active' ? 'ממתין (תורו כעת)' : 'ממתין בתור';
      wsData.push([
        i===0 ? env.title : '',
        i===0 ? (STATUS_LABEL[env.status]||env.status) : '',
        i===0 ? (env.createdByName||'') : '',
        i===0 ? fmtDT(env.createdAt) : '',
        i===0 ? (env.completedAt ? fmtDT(env.completedAt) : '') : '',
        i===0 ? (env.flowType==='sequential'?'טורית':'מקבילה') : '',
        i===0 ? env.signers.length : '',
        i===0 ? signedCount : '',
        s.name, s.email, signerStatusText, s.signedAt ? fmtDT(s.signedAt) : ''
      ]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:24},{wch:12},{wch:18},{wch:16},{wch:16},{wch:10},{wch:10},{wch:8},{wch:20},{wch:26},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'דוח מסמכים');
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `דוח-מצב-מסמכים-${dateStr}.xlsx`);
  toast(`יוצא דוח עבור ${state.envelopes.length} מסמכים`);
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  if(state.currentEnvId){ renderEnvelopeDetail(); return; }
  const cu = getCurrentUser();
  const pushEnabled = !!(cu && cu.fcmToken);
  let html = `<div class="page-title">מסמכים לחתימה</div><div class="page-sub">מעקב אחר כלל תהליכי החתימה הפעילים והשלמים בארגון.</div>`;

  // ---- מסמכים הממתינים לחתימתי — אזור בולט למעלה, עם כפתור חתימה ישיר ----
  const myPending = cu ? state.envelopes.filter(env =>
    !['Completed','Voided','Declined'].includes(env.status) &&
    env.signers.some(s=>s.id===cu.id && s.status==='active')
  ) : [];
  if(myPending.length>0){
    html += `<div class="card card-pad section-block" style="border-color:var(--seal);background:#FBF3F1;">

function downloadBase64Pdf(base64, filename){
  const buf = base64ToBuf(base64); const blob = new Blob([buf], {type:'application/pdf'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function openDocumentInNewTab(base64){
  try{
    const buf = base64ToBuf(base64);
    const blob = new Blob([buf], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if(!win){ toastError('הדפדפן חסם את פתיחת החלון — יש לאשר חלונות קופצים לאתר הזה ולנסות שוב.'); }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(err){ console.error('[signflow] open document failed', err); toastError('שגיאה בפתיחת המסמך לקריאה.'); }
}
function downloadAuditTrail(env){
  const lines = [];
  lines.push('תעודת מעקב — ' + env.title);
  lines.push('='.repeat(50));
  lines.push('שם קובץ: ' + env.documentName);
  lines.push('הועלה על ידי: ' + (env.createdByName||'לא ידוע'));
  lines.push('נוצר: ' + fmtDT(env.createdAt));
  lines.push('סטטוס נוכחי: ' + (STATUS_LABEL[env.status]||env.status));
  lines.push('סוג זרימה: ' + (env.flowType==='sequential'?'טורית':'מקבילה'));
  if(env.completedAt) lines.push('הושלם: ' + fmtDT(env.completedAt));
  lines.push('');
  lines.push('חותמים:');
  env.signers.forEach((s,i)=>{
    const statusText = s.status==='signed' ? `נחתם ${fmtDT(s.signedAt)}` : s.status==='declined' ? `נדחה ${fmtDT(s.declinedAt)} — ${s.declineReason||''}` : s.status==='active' ? 'ממתין לחתימה כעת' : 'ממתין בתור';
    lines.push(`  ${i+1}. ${s.name} <${s.email}> — ${statusText}`);
  });
  lines.push('');
  lines.push('Audit Trail:');
  lines.push('-'.repeat(50));
  env.auditLog.forEach(a=>{ lines.push(`${fmtDT(a.ts)}  |  ${a.actor}  |  ${a.action}`); });
  if(env.originalHash) { lines.push(''); lines.push('Hash מסמך מקורי (SHA-256): ' + env.originalHash); }
  if(env.finalHash) lines.push('Hash מסמך חתום (SHA-256): ' + env.finalHash);

  const text = lines.join('\n');
  const blob = new Blob(['\uFEFF' + text], {type:'text/plain;charset=utf-8'}); // BOM כדי שעברית תיפתח נכון ב-Notepad
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = 'תיעוד-' + env.title.replace(/[\\/:*?"<>|]/g,'') + '.txt'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

async function openSignModal(envId, signerId){
  const env = await StorageAPI.getEnvelope(envId);
  const signer = env.signers.find(s=>s.id===signerId);
  const myFields = env.fields.filter(f=>f.fieldSignerId===signerId);
  addAudit(env, signer.name, usingCloudBackend ? 'זהות אומתה באמצעות התחברות עם Google, ומסמך נפתח לצפייה' : 'מסמך נפתח לצפייה (מצב הדגמה מקומי — ללא אימות זהות אמיתי)');
  await StorageAPI.saveEnvelope(env);
  state.signModal = { envId, signerId, step: myFields.length>0 ? 'fill' : 'place', placePage: 1, sigDataUrl:'' };
  renderSignModal();
}
function closeSignModal(){ state.signModal=null; document.getElementById('signModalOverlay')?.remove(); }

async function renderSignModal(){
  const sm = state.signModal;
  const env = await StorageAPI.getEnvelope(sm.envId);
  const signer = env.signers.find(s=>s.id===sm.signerId);
  const myFields = env.fields.filter(f=>f.fieldSignerId===sm.signerId).sort((a,b)=> a.page-b.page || a.yPct-b.yPct);
  let overlay = document.getElementById('signModalOverlay');
  if(!overlay){ overlay = document.createElement('div'); overlay.className='modal-overlay'; overlay.id='signModalOverlay'; document.body.appendChild(overlay); }

  let bodyHtml = '';
  if(sm.step==='place') bodyHtml = placeStepHtml(env, signer);
  else if(sm.step==='fill') bodyHtml = fillStepHtml(env, signer, myFields);
  else if(sm.step==='done') bodyHtml = doneStepHtml();

  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><div><div style="font-weight:700;font-family:var(--serif);font-size:18px;">חתימה על מסמך</div>
    <div style="font-size:12.5px;color:var(--gray);">${escapeHtml(env.title)} — ${escapeHtml(signer.name)}</div></div>
    <button class="icon-btn" id="btn-close-modal" style="font-size:18px;">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
    ${sm.step!=='done' ? `<div class="modal-foot" id="modalFoot"></div>` : ''}
  </div>`;
  document.getElementById('btn-close-modal')?.addEventListener('click', closeSignModal);
  if(sm.step==='place') bindPlaceStep(env, signer);
  if(sm.step==='fill') bindFillStep(env, signer, myFields);
  if(sm.step==='done') bindDoneStep();
}

  <div class="otp-demo-note" style="background:var(--moss-soft);border-color:#BFDBCF;color:#1f4438;">✍️ לחצו על המסמך במקום המדויק שבו תרצו לחתום. ניתן לדפדף בין העמודים אם המסמך כולל יותר מעמוד אחד.</div>
